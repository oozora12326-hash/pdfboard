    const urlParams = new URLSearchParams(window.location.search);

    document.getElementById('roomLabel').textContent = `Room: ${ROOM_ID}`;

    let db = null;

    let currentStrokeUnsubscribe = null;
    let resizeHandler = null;

    let currentFolderId = null;
    let activeBottomTab = 'browse';

    let pendingMoveTarget = null;
    let movingItemInFlight = null;

    let isLongPressReordering = false;
    let isReorderingInFlight = false;

    let lastQuotaAlertAt = 0;

    function extractLeadingNumber(name = '') {
      const circleMatch = name.match(/[①-⑳]/);
      if (circleMatch) {
        return circleMatch[0].codePointAt(0) - 9311;
      }
      const numMatch = name.match(/^\s*0*(\d+)/);
      if (numMatch) {
        return parseInt(numMatch[1], 10);
      }
      return Number.MAX_SAFE_INTEGER;
    }

    function navigateBackInBrowse() {
      if (!currentFolderId) return false;
      const cur = state.folders.find(f => f.id === currentFolderId);
      currentFolderId = cur ? (cur.parentId || null) : null;
      renderBrowser();
      return true;
    }

    function attachLeftEdgeSwipeBack(targetEl, onSwipeBack) {
      if (!targetEl) return;
      const EDGE_THRESHOLD = 28;
      const SWIPE_DISTANCE = 70;
      let tracking = false;
      let startX = 0;
      let startY = 0;
      let triggered = false;

      targetEl.addEventListener('pointerdown', (e) => {
        if (isLongPressReordering) return;
        if (e.pointerType === 'mouse' && e.button !== 0) return;
        if (e.clientX <= EDGE_THRESHOLD) {
          tracking = true;
          triggered = false;
          startX = e.clientX;
          startY = e.clientY;
        }
      }, { passive: true });

      targetEl.addEventListener('pointermove', (e) => {
        if (!tracking || triggered) return;
        const dx = e.clientX - startX;
        const dy = e.clientY - startY;
        if (Math.abs(dy) > 45 && dx < 35) {
          tracking = false;
          return;
        }
        if (dx >= SWIPE_DISTANCE && Math.abs(dx) > Math.abs(dy) * 1.2) {
          triggered = true;
          tracking = false;
          suppressNextClick = true;
          setTimeout(() => { suppressNextClick = false; }, 180);
          onSwipeBack();
        }
      }, { passive: true });

      const resetTracking = () => {
        tracking = false;
        triggered = false;
      };
      targetEl.addEventListener('pointerup', resetTracking, { passive: true });
      targetEl.addEventListener('pointercancel', resetTracking, { passive: true });
    }

    function showQuotaExceededAlert(message = '許容量を超えています。') {
      const now = Date.now();
      if (now - lastQuotaAlertAt < 1500) return;
      lastQuotaAlertAt = now;
      alert(message);
    }

    function notifyIfQuotaExceeded(err, customMessage = '許容量を超えています。') {
      const code = (err && err.code) ? String(err.code).toLowerCase() : '';
      const name = (err && err.name) ? String(err.name).toLowerCase() : '';
      const msg = (err && err.message) ? String(err.message).toLowerCase() : '';

      const isQuotaError =
        code.includes('resource-exhausted') ||
        code.includes('invalid-argument') ||
        name.includes('quotaexceedederror') ||
        msg.includes('quota') ||
        msg.includes('exceeds the maximum allowed size') ||
        msg.includes('too large');

      if (isQuotaError) {
        showQuotaExceededAlert(customMessage);
        return true;
      }
      return false;
    }

    function safeSetLocalStorage(key, valueStr) {
      try {
        localStorage.setItem(key, valueStr);
        return true;
      } catch (err) {
        console.error('localStorage save error:', err);
        if (!notifyIfQuotaExceeded(err, '許容量を超えています。ブラウザの保存容量が上限に達しました。')) {
          showQuotaExceededAlert('許容量を超えています。データを保存できませんでした。');
        }
        return false;
      }
    }

    function estimateDataUrlBytes(dataUrl) {
      if (!dataUrl || !dataUrl.includes(',')) return 0;
      const base64 = dataUrl.split(',')[1];
      const padding = (base64.match(/=+$/) || [''])[0].length;
      return Math.max(0, Math.floor((base64.length * 3) / 4) - padding);
    }

    function readFileAsDataUrl(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onerror = () => reject(new Error('ファイル読み込みに失敗しました'));
        reader.onload = (event) => resolve(event.target.result);
        reader.readAsDataURL(file);
      });
    }

    async function compressImageToTargetBytes(file, targetBytes = 500 * 1024) {
      const originalDataUrl = await readFileAsDataUrl(file);
      const originalBytes = estimateDataUrlBytes(originalDataUrl);

      if (originalBytes > 0 && originalBytes <= targetBytes) {
        return originalDataUrl;
      }

      const img = await new Promise((resolve, reject) => {
        const image = new Image();
        image.onerror = () => reject(new Error('画像の読み込みに失敗しました'));
        image.onload = () => resolve(image);
        image.src = originalDataUrl;
      });

      const maxDims = [1600, 1280, 1024, 800];
      const qualities = [0.8, 0.65, 0.5, 0.38];
      let bestDataUrl = originalDataUrl;

      for (const maxDim of maxDims) {
        let { width, height } = img;
        if (width > maxDim || height > maxDim) {
          if (width >= height) {
            height = Math.max(1, Math.round((height * maxDim) / width));
            width = maxDim;
          } else {
            width = Math.max(1, Math.round((width * maxDim) / height));
            height = maxDim;
          }
        }

        const canvas = document.createElement('canvas');
        canvas.width = width;
        canvas.height = height;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, width, height);

        for (const q of qualities) {
          const candidateUrl = canvas.toDataURL('image/jpeg', q);
          bestDataUrl = candidateUrl;
          if (estimateDataUrlBytes(candidateUrl) <= targetBytes) {
            return candidateUrl;
          }
        }
      }

      return bestDataUrl;
    }

    function initApp() {
      if (FIREBASE_CONFIG.apiKey && FIREBASE_CONFIG.projectId) {
        try {
          if (!firebase.apps.length) {
            firebase.initializeApp(FIREBASE_CONFIG);
          }
          db = firebase.firestore();
          isCloudMode = true;
          const dot = document.getElementById('syncStatusDot');
          const txt = document.getElementById('syncStatusText');
          if (dot) dot.className = "w-2 h-2 rounded-full bg-emerald-500 animate-pulse inline-block";
          if (txt) txt.textContent = "クラウド同期";

          setInterval(updatePresence, 10000);
          updatePresence();
        } catch (e) {
          console.error("Firebase init failed:", e);
        }
      }
      initCloudListeners();
    }

    async function updatePresence(currentDocId = null, currentPageNum = null) {
      if (!isCloudMode) return;
      try {
        await db.collection('rooms').doc(ROOM_ID).collection('presence').doc(USER_CLIENT_ID).set({
          lastSeen: firebase.firestore.FieldValue.serverTimestamp(),
          viewingDoc: currentDocId,
          page: currentPageNum
        }, { merge: true });
      } catch(e) { console.error(e); }
    }

    const STORAGE_KEY_STATE = 'pdf_sync_board_state_v5';
    const STORAGE_KEY_ANNOTATIONS = 'pdf_sync_board_annotations_v3';
    const STORAGE_KEY_RECENT = 'pdf_sync_board_recent_v1';

    const defaultState = {
      folders: [
        { id: 'folder-default', name: '未分類・図面一式', parentId: null, order: 0 }
      ],
      documents: [
        {
          id: 'sample-plan-01',
          name: 'サンプル平面図_1F.pdf',
          folderId: 'folder-default',
          type: 'sample',
          order: 0,
          numPages: 2
        }
      ]
    };

    let state = loadState();
    let annotations = loadAnnotations();
    let recentDocIds = loadRecentDocs();

    function loadState() {
      const saved = localStorage.getItem(STORAGE_KEY_STATE);
      if (saved) {
        try { return JSON.parse(saved); } catch(e) { console.error(e); }
      }
      return defaultState;
    }

    function saveState() {
      if (!isCloudMode) {
        return safeSetLocalStorage(STORAGE_KEY_STATE, JSON.stringify(state));
      }
      return true;
    }

    function loadAnnotations() {
      const saved = localStorage.getItem(STORAGE_KEY_ANNOTATIONS);
      if (saved) {
        try { return JSON.parse(saved); } catch(e) { console.error(e); }
      }
      return {};
    }

    function saveAnnotationsData() {
      if (!isCloudMode) {
        return safeSetLocalStorage(STORAGE_KEY_ANNOTATIONS, JSON.stringify(annotations));
      }

    function initCloudListeners() {
      if (!isCloudMode) {
        renderBrowser();
        return;
      }

      const roomRef = db.collection('rooms').doc(ROOM_ID);

      roomRef.collection('folders').onSnapshot(snap => {
        const existingDefault = state.folders.find(f => f.id === 'folder-default');
        let defaultFolder = existingDefault || {
          id: 'folder-default', name: '未分類・図面一式', parentId: null, order: 0
        };

        const list = [];
        snap.forEach(doc => {
          const d = doc.data();
          const existingLocalFolder = state.folders.find(item => item.id === doc.id);
          const resolvedParentId = (movingItemInFlight && movingItemInFlight.type === 'folder' && movingItemInFlight.id === doc.id && existingLocalFolder)
            ? existingLocalFolder.parentId
            : (d.parentId || null);

          if (doc.id === 'folder-default') {
            defaultFolder = {
              id: 'folder-default',
              name: d.name || '未分類・図面一式',
              parentId: resolvedParentId,
              order: d.order !== undefined ? d.order : 0
            };
          } else {
            list.push({
              id: doc.id,
              name: d.name,
              parentId: resolvedParentId,
              order: d.order !== undefined ? d.order : 999
            });
          }
        });

        list.push(defaultFolder);
        list.sort((a, b) => (a.order || 0) - (b.order || 0));
        state.folders = list;
        if (!isLongPressReordering && !isReorderingInFlight) renderBrowser();
      });

      roomRef.collection('documents').onSnapshot(snap => {
        const docsList = [];
        snap.forEach(docSnap => {
          const data = docSnap.data();
          const existingLocal = state.documents.find(item => item.id === docSnap.id);
          const mergedDataUrl = data.dataUrl || (existingLocal ? existingLocal.dataUrl : null);
          const resolvedFolderId = (movingItemInFlight && movingItemInFlight.type === 'doc' && movingItemInFlight.id === docSnap.id && existingLocal)
            ? existingLocal.folderId
            : (data.folderId || 'folder-default');
          const resolvedOrder = (isReorderingInFlight && existingLocal)
            ? existingLocal.order
            : (data.order !== undefined ? data.order : 999);

          docsList.push({
            id: docSnap.id,
            name: data.name,
            folderId: resolvedFolderId,
            type: data.type || 'pdf',
            dataUrl: mergedDataUrl,
            order: resolvedOrder,
            numPages: existingLocal ? (existingLocal.numPages || 1) : 1
          });
        });
        docsList.sort((a, b) => (a.order || 0) - (b.order || 0));
        state.documents = docsList;
        if (!isLongPressReordering && !isReorderingInFlight) renderBrowser();
      });

      roomRef.collection('presence').onSnapshot(snap => {
        let count = 0;
        const now = Date.now();
        snap.forEach(doc => {
          const data = doc.data();
          if (data.lastSeen && (now - data.lastSeen.toMillis() < 30000)) {
            count++;
          }
        });
        const countEl = document.getElementById('activeUsersCount');
        if (countEl) {
          countEl.textContent = `${Math.max(1, count)}人接続`;
        }
      });
    }

    async function createFolder(parentId = null) {
      const promptTitle = parentId
        ? 'このフォルダ内に作成するサブフォルダ名を入力してください:'
        : '新しいフォルダ名を入力してください:';
      const defaultName = parentId ? 'サブフォルダ' : '施工図・電気設備';
      const name = prompt(promptTitle, defaultName);
      if (!name || !name.trim()) return;

      const siblings = state.folders.filter(f => (f.parentId || null) === parentId);
      const newOrder = siblings.length > 0 ? Math.max(...siblings.map(f => f.order || 0)) + 1 : 0;

      try {
        if (isCloudMode) {
          await db.collection('rooms').doc(ROOM_ID).collection('folders').add({
            name: name.trim(),
            parentId: parentId || null,
            order: newOrder,
            createdAt: firebase.firestore.FieldValue.serverTimestamp()
          });
        } else {
          state.folders.push({
            id: 'folder-' + Date.now(),
            name: name.trim(),
            parentId: parentId || null,
            order: newOrder
          });
          saveState();
          renderBrowser();
        }
      } catch (err) {
        console.error(err);
        notifyIfQuotaExceeded(err);
      }
    }

    async function moveFolderToParent(folderId, newParentId) {
      if (folderId === 'folder-default' || folderId === newParentId) return;
      if (newParentId && getDescendantFolderIds(folderId).includes(newParentId)) return;

      const siblings = state.folders
        .filter(f => (f.parentId || null) === (newParentId || null) && f.id !== folderId)
        .sort((a, b) => (a.order || 0) - (b.order || 0));
      const newOrder = siblings.length;

      const localFolder = state.folders.find(f => f.id === folderId);
      if (localFolder) {
        localFolder.parentId = newParentId || null;
        localFolder.order = newOrder;
      }

      try {
        if (isCloudMode) {
          await db.collection('rooms').doc(ROOM_ID).collection('folders').doc(folderId).set({
            parentId: newParentId || null,
            order: newOrder
          }, { merge: true });
        } else {
          saveState();
        }
      } catch (err) {
        console.error(err);
        notifyIfQuotaExceeded(err);
      }
    }

    async function moveDocToFolder(docId, folderId) {
      const normalizedFolderId = folderId || 'folder-default';
      const docsInTarget = state.documents
        .filter(d => (d.folderId || 'folder-default') === normalizedFolderId && d.id !== docId)
        .sort((a, b) => (a.order || 0) - (b.order || 0));
      const newOrder = docsInTarget.length;

      const localDoc = state.documents.find(d => d.id === docId);
      if (localDoc) {
        localDoc.folderId = normalizedFolderId;
        localDoc.order = newOrder;
      }

      try {
        if (isCloudMode) {
          await db.collection('rooms').doc(ROOM_ID).collection('documents').doc(docId).set({
            folderId: normalizedFolderId,
            order: newOrder
          }, { merge: true });
        } else {
          saveState();
        }
      } catch (err) {
        console.error(err);
        notifyIfQuotaExceeded(err);
      }
    }

    async function saveFolderDocsOrder(folderId, orderedDocs) {
      const normalizedFolderId = folderId || 'folder-default';
      const orderMap = new Map();
      orderedDocs.forEach((d, idx) => {
        d.order = idx;
        d.folderId = normalizedFolderId;
        orderMap.set(d.id, idx);
      });

      state.documents.forEach(item => {
        if (orderMap.has(item.id)) {
          item.order = orderMap.get(item.id);
          item.folderId = normalizedFolderId;
        }
      });
      state.documents.sort((a, b) => (a.order || 0) - (b.order || 0));

      isReorderingInFlight = true;
      try {
        if (isCloudMode) {
          const batch = db.batch();
          orderedDocs.forEach((d, idx) => {
            const ref = db.collection('rooms').doc(ROOM_ID).collection('documents').doc(d.id);
            batch.set(ref, { order: idx, folderId: normalizedFolderId }, { merge: true });
          });
          await batch.commit();
        } else {
          saveState();
        }
      } catch (err) {
        console.error(err);
        notifyIfQuotaExceeded(err);
      } finally {
        isReorderingInFlight = false;
      }
    }

    document.getElementById('localImageInput').addEventListener('change', async (e) => {
      const files = Array.from(e.target.files || []);
      if (files.length === 0) return;

      const targetFolderId = currentFolderId || 'folder-default';
      const targetDocs = state.documents.filter(d => (d.folderId || 'folder-default') === targetFolderId);
      let nextOrder = targetDocs.length > 0 ? Math.max(...targetDocs.map(d => d.order || 0)) + 1 : 0;

      for (const file of files) {
        try {
          const lowerName = file.name.toLowerCase();
          const mimeType = (file.type || '').toLowerCase();
          let fileType = 'image';
          let dataUrl = '';

          if (lowerName.endsWith('.pdf') || mimeType === 'application/pdf') {
            fileType = 'pdf';
            dataUrl = await readFileAsDataUrl(file);
          } else if (lowerName.endsWith('.zwd') || lowerName.endsWith('.zfd')) {
            fileType = 'cad';
            dataUrl = await readFileAsDataUrl(file);
          } else {
            fileType = 'image';
            dataUrl = await compressImageToTargetBytes(file, 500 * 1024);
          }

          if (isCloudMode && dataUrl.length > 950000) {
            showQuotaExceededAlert(`許容量を超えています。\n「${file.name}」は1ファイルの保存上限を超えているため追加できません。`);
            continue;
          }

          if (isCloudMode) {
            await db.collection('rooms').doc(ROOM_ID).collection('documents').add({
              name: file.name,
              folderId: targetFolderId,
              type: fileType,
              dataUrl: dataUrl,
              order: nextOrder++,
              createdAt: firebase.firestore.FieldValue.serverTimestamp()
            });
          } else {
            const newId = 'doc-' + Date.now() + '-' + Math.random().toString(36).substring(2, 6);
            state.documents.push({
              id: newId,
              name: file.name,
              folderId: targetFolderId,
              type: fileType,
              dataUrl: dataUrl,
              order: nextOrder++,
              numPages: 1
            });
            const savedOk = saveState();
            if (!savedOk) {
              state.documents = state.documents.filter(d => d.id !== newId);
            }
            renderBrowser();
          }
        } catch (err) {
          console.error('File add failed:', err);
          if (!notifyIfQuotaExceeded(err, `許容量を超えています。\n「${file.name}」を追加できませんでした。`)) {
            alert(`「${file.name}」の追加に失敗しました。`);
          }
        }
      }
      e.target.value = '';
    });

    function getDescendantFolderIds(folderId) {
      let ids = [folderId];
      const children = state.folders.filter(f => f.parentId === folderId);
      children.forEach(c => {
        ids = ids.concat(getDescendantFolderIds(c.id));
      });
      return ids;
    }

    function getFlatFolderOptions(parentId = null, depth = 0, excludedIds = new Set()) {
      let options = [];
      const children = state.folders
        .filter(f => (f.parentId || null) === parentId && !excludedIds.has(f.id))
        .sort((a, b) => (a.order || 0) - (b.order || 0));

      children.forEach(f => {
        const prefix = depth > 0 ? ' '.repeat(depth) + '└ ' : '';
        options.push({ id: f.id, label: `${prefix}📁 ${f.name}` });
        options = options.concat(getFlatFolderOptions(f.id, depth + 1, excludedIds));
      });
      return options;
    }

    function getFolderPath(folderId) {
      const path = [];
      let curId = folderId;
      const visited = new Set();
      while (curId && !visited.has(curId)) {
        visited.add(curId);
        const found = state.folders.find(f => f.id === curId);
        if (!found) break;
        path.unshift(found);
        curId = found.parentId || null;
      }
      return path;
    }

    function renderBreadcrumb() {

          .map(id => state.documents.find(d => d.id === id))

      } else {
        headerTitle.textContent = 'ブラウズ';

      let foldersToShow = [];

        sortByNumberBtn.classList.add('hidden');
        folderSection.classList.remove('hidden');
        foldersToShow = state.folders
          .filter(f => f.name.toLowerCase().includes(searchQuery))
          .sort((a, b) => (a.order || 0) - (b.order || 0));
        docsToShow = state.documents
          .filter(d => d.name.toLowerCase().includes(searchQuery))
          .sort((a, b) => (a.order || 0) - (b.order || 0));
        docSectionTitle.textContent = '検索結果の図面・ファイル';
      } else {
        folderSection.classList.remove('hidden');
        foldersToShow = state.folders
          .filter(f => (f.parentId || null) === currentFolderId)
          .sort((a, b) => (a.order || 0) - (b.order || 0));

        if (!currentFolderId) {
          reorderHintText.classList.add('hidden');
          sortByNumberBtn.classList.add('hidden');
          docsToShow = state.documents
            .filter(d => !d.folderId)
            .sort((a, b) => (a.order || 0) - (b.order || 0));
          docSectionTitle.textContent = 'その他のファイル';
        } else {
          docsToShow = state.documents
            .filter(d => (d.folderId || 'folder-default') === currentFolderId)
            .sort((a, b) => (a.order || 0) - (b.order || 0));
          docSectionTitle.textContent = '図面・ファイル';
          canReorderInCurrentView = docsToShow.length > 1;
          reorderTargetFolderId = currentFolderId;
          reorderHintText.classList.toggle('hidden', !canReorderInCurrentView);
          sortByNumberBtn.classList.toggle('hidden', !canReorderInCurrentView);

      }

      folderGroupList.innerHTML = '';

        folderGroupList.innerHTML = `<div class="px-4 py-4 text-xs text-slate-400 text-center">表示するフォルダがありません</div>`;
      } else {
        foldersToShow.forEach(folder => {
          const childFoldersCount = state.folders.filter(f => f.parentId === folder.id).length;
          const directDocsCount = state.documents.filter(d => d.folderId === folder.id).length;
          const totalItems = childFoldersCount + directDocsCount;
          const isMovableFolder = folder.id !== 'folder-default';

          const row = document.createElement('div');
          row.className = 'px-4 py-3 flex items-center justify-between gap-2 hover:bg-slate-50 active:bg-slate-100 transition cursor-pointer';

    function attachLongPressReorder(rowEl, doc, container, docsList, folderId) {
      let longPressTimer = null;
      let activeDrag = false;
      let startX = 0;
      let startY = 0;
      let currentOrderedDocs = [...docsList];

      function clearLongPressTimer() {
        if (longPressTimer) {
          clearTimeout(longPressTimer);
          longPressTimer = null;
        }
      }

      function findTargetDocIdAtY(clientY) {
        const rows = Array.from(container.querySelectorAll('.doc-row-item'));
        for (const r of rows) {
          const rect = r.getBoundingClientRect();
          if (clientY >= rect.top && clientY <= rect.bottom) {
            return r.dataset.docId;
          }
        }
        if (rows.length > 0) {
          const firstRect = rows[0].getBoundingClientRect();
          if (clientY < firstRect.top) return rows[0].dataset.docId;
          const lastRect = rows[rows.length - 1].getBoundingClientRect();
          if (clientY > lastRect.bottom) return rows[rows.length - 1].dataset.docId;
        }
        return null;
      }

      function onPointerMove(e) {
        if (!activeDrag) {
          if (Math.hypot(e.clientX - startX, e.clientY - startY) > 14) {
            clearLongPressTimer();
          }
          return;
        }

        e.preventDefault();
        const targetId = findTargetDocIdAtY(e.clientY);
        if (!targetId || targetId === doc.id) return;

        const fromIdx = currentOrderedDocs.findIndex(d => d.id === doc.id);
        const toIdx = currentOrderedDocs.findIndex(d => d.id === targetId);
        if (fromIdx === -1 || toIdx === -1 || fromIdx === toIdx) return;

        const [moved] = currentOrderedDocs.splice(fromIdx, 1);
        currentOrderedDocs.splice(toIdx, 0, moved);

        const rowMap = new Map();
        Array.from(container.querySelectorAll('.doc-row-item')).forEach(r => {
          rowMap.set(r.dataset.docId, r);
        });
        currentOrderedDocs.forEach(itemDoc => {
          const matchedRow = rowMap.get(itemDoc.id);
          if (matchedRow) container.appendChild(matchedRow);
        });
      }

      async function onPointerUp() {
        clearLongPressTimer();
        window.removeEventListener('pointermove', onPointerMove);
        window.removeEventListener('pointerup', onPointerUp);
        window.removeEventListener('pointercancel', onPointerUp);

        if (!activeDrag) return;
        activeDrag = false;
        isLongPressReordering = false;
        suppressNextClick = true;
        setTimeout(() => { suppressNextClick = false; }, 160);

        const activeRow = container.querySelector(`.doc-row-item[data-doc-id="${doc.id}"]`);
        if (activeRow) {
          activeRow.classList.remove('doc-row-reordering');
          activeRow.style.touchAction = '';
        }

        await saveFolderDocsOrder(folderId, currentOrderedDocs);
        renderBrowser();
      }

      rowEl.addEventListener('pointerdown', (e) => {
        if (e.button !== undefined && e.button !== 0) return;
        if (e.target.closest('.move-doc-btn') || e.target.closest('.delete-doc-btn')) return;

        startX = e.clientX;
        startY = e.clientY;
        currentOrderedDocs = [...docsList];

        longPressTimer = setTimeout(() => {
          activeDrag = true;
          isLongPressReordering = true;
          rowEl.classList.add('doc-row-reordering');
          rowEl.style.touchAction = 'none';
          if (navigator.vibrate) {
            try { navigator.vibrate(20); } catch (_) {}
          }
        }, 350);

        window.addEventListener('pointermove', onPointerMove, { passive: false });
        window.addEventListener('pointerup', onPointerUp);
        window.addEventListener('pointercancel', onPointerUp);
      });
    }

    function renderDocRows(container, docsList, options = {}) {
      const { allowLongPressReorder = false, folderId = null } = options;
      container.innerHTML = '';
      if (docsList.length === 0) {

            saveState();
            renderBrowser();
          }
        });

        if (allowLongPressReorder && folderId) {
          attachLongPressReorder(row, doc, container, docsList, folderId);
        }

        container.appendChild(row);
      });
    }

    async function initViewerLogic(doc) {
      let currentPage = 1;
      let currentScale = 0.6;
      let activeTool = 'pan';
      let currentColor = '#ef4444';
      let currentWidth = 1;
      let pdfDocInstance = null;
      let redoStack = [];
      let selectedImageId = null;
      const loadedImagesCache = {};

      let pendingCloudSyncTimer = null;
      const pendingCloudStrokes = new Map();

      function flushCloudStrokes() {
        if (!isCloudMode || pendingCloudStrokes.size === 0) return;
        const batch = db.batch();
        pendingCloudStrokes.forEach(({ pageKey, strokeId, payload }) => {
          const ref = db.collection('rooms').doc(ROOM_ID)
            .collection('annotations').doc(pageKey)
            .collection('strokes').doc(strokeId);
          batch.set(ref, payload);
        });
        pendingCloudStrokes.clear();
        batch.commit().catch(err => {
          console.error('Batch stroke sync failed:', err);
          notifyIfQuotaExceeded(err, '許容量を超えています。一部の書き込みを保存できませんでした。');
        });
      }

      const pdfCanvas = document.getElementById('pdfCanvas');
      const drawCanvas = document.getElementById('drawCanvas');
      const pdfCtx = pdfCanvas.getContext('2d');
      const wrapper = document.getElementById('canvasWrapper');
      const scaleBox = document.getElementById('canvasScaleBox');
      const canvasContainer = document.getElementById('canvasContainer');

      function applyScale(newScale, keepCenter = true) {
        const prevScrollW = canvasContainer.scrollWidth || 1;
        const prevScrollH = canvasContainer.scrollHeight || 1;
        const centerRatioX = (canvasContainer.scrollLeft + canvasContainer.clientWidth / 2) / prevScrollW;
        const centerRatioY = (canvasContainer.scrollTop + canvasContainer.clientHeight / 2) / prevScrollH;

        currentScale = Math.max(0.1, Math.min(5.0, +newScale.toFixed(3)));
        wrapper.style.transform = `scale(${currentScale})`;

        if (scaleBox && pdfCanvas.width > 0 && pdfCanvas.height > 0) {
          scaleBox.style.width = `${Math.round(pdfCanvas.width * currentScale)}px`;
          scaleBox.style.height = `${Math.round(pdfCanvas.height * currentScale)}px`;
        }
        document.getElementById('scaleLabel').textContent = `${Math.round(currentScale * 100)}%`;

        if (keepCenter) {
          const newScrollW = canvasContainer.scrollWidth;
          const newScrollH = canvasContainer.scrollHeight;
          canvasContainer.scrollLeft = Math.max(0, newScrollW * centerRatioX - canvasContainer.clientWidth / 2);
          canvasContainer.scrollTop = Math.max(0, newScrollH * centerRatioY - canvasContainer.clientHeight / 2);
        }
      }

      function centerCanvasScroll() {
        setTimeout(() => {
          if (canvasContainer) {
            const targetX = (canvasContainer.scrollWidth - canvasContainer.clientWidth) / 2;
            const targetY = (canvasContainer.scrollHeight - canvasContainer.clientHeight) / 2;
            canvasContainer.scrollLeft = Math.max(0, targetX);
            canvasContainer.scrollTop = Math.max(0, targetY);
          }
        }, 50);
      }

      let initialPinchDistance = null;
      let initialPinchScale = currentScale;

      function getTouchDistance(touches) {
        const dx = touches[0].clientX - touches[1].clientX;
        const dy = touches[0].clientY - touches[1].clientY;
        return Math.hypot(dx, dy);
      }

      canvasContainer.addEventListener('touchstart', (e) => {
        if (e.touches.length === 2) {
          initialPinchDistance = getTouchDistance(e.touches);
          initialPinchScale = currentScale;
        }
      }, { passive: true });

      canvasContainer.addEventListener('touchmove', (e) => {
        if (e.touches.length === 2 && initialPinchDistance !== null) {
          e.preventDefault();
          const currentDistance = getTouchDistance(e.touches);
          const ratio = currentDistance / initialPinchDistance;
          applyScale(initialPinchScale * ratio, true);
        }
      }, { passive: false });

      canvasContainer.addEventListener('touchend', (e) => {
        if (e.touches.length < 2) {
          initialPinchDistance = null;
        }
      }, { passive: true });

      function subscribePageStrokes(pageKey) {
        if (currentStrokeUnsubscribe) {
          currentStrokeUnsubscribe();
          currentStrokeUnsubscribe = null;
        }
        if (!isCloudMode) {
          drawOverlay();
          return;
        }

        if (!annotations[pageKey]) annotations[pageKey] = [];

        const strokesRef = db.collection('rooms').doc(ROOM_ID)
          .collection('annotations').doc(pageKey)
          .collection('strokes').orderBy('createdAt', 'asc');

        currentStrokeUnsubscribe = strokesRef.onSnapshot(snap => {
          snap.docChanges().forEach(change => {
            const strokeId = change.doc.id;
            const data = change.doc.data();

            if (change.type === 'added') {
              if (!annotations[pageKey].find(s => s.id === strokeId)) {
                annotations[pageKey].push({ id: strokeId, ...data });
              }
            } else if (change.type === 'modified') {
              const idx = annotations[pageKey].findIndex(s => s.id === strokeId);
              if (idx !== -1) annotations[pageKey][idx] = { id: strokeId, ...data };
            } else if (change.type === 'removed') {
              annotations[pageKey] = annotations[pageKey].filter(s => s.id !== strokeId);
            }
          });
          drawOverlay();
        });
      }

      function autoFitScale(imgWidth, imgHeight) {
        const maxW = Math.max(200, canvasContainer.clientWidth - 96);
        const maxH = Math.max(200, canvasContainer.clientHeight - 96);
        const scaleX = maxW / imgWidth;
        const scaleY = maxH / imgHeight;
        return Math.max(0.1, Math.min(scaleX, scaleY, 1.0));
      }

      async function getPdfInstance() {
        if (pdfDocInstance) return pdfDocInstance;
        let loadingTask;
        if (doc.dataUrl && doc.dataUrl.startsWith('data:')) {
          const base64Data = doc.dataUrl.split(',')[1];
          const binaryString = atob(base64Data);
          const len = binaryString.length;
          const bytes = new Uint8Array(len);
          for (let i = 0; i < len; i++) {
            bytes[i] = binaryString.charCodeAt(i);
          }
          loadingTask = pdfjsLib.getDocument({ data: bytes });
        } else {
          loadingTask = pdfjsLib.getDocument(doc.dataUrl);
        }
        pdfDocInstance = await loadingTask.promise;
        doc.numPages = pdfDocInstance.numPages;
        return pdfDocInstance;
      }

      async function renderPage() {
        flushCloudStrokes();
        const pageKey = `${doc.id}_p${currentPage}`;
        if (isCloudMode) {
          updatePresence(doc.id, currentPage);
        }

        if (doc.type === 'sample') {
          pdfCanvas.width = 800;
          pdfCanvas.height = 1100;
          drawCanvas.width = 800;
          drawCanvas.height = 1100;
          pdfCtx.fillStyle = '#ffffff';
          pdfCtx.fillRect(0, 0, 800, 1100);
          pdfCtx.strokeStyle = '#334155';
          pdfCtx.lineWidth = 3;
          pdfCtx.strokeRect(50, 50, 700, 1000);
          pdfCtx.fillStyle = '#0f172a';
          pdfCtx.font = 'bold 24px sans-serif';
          pdfCtx.fillText(`サンプル建築平面図 - ${currentPage}階`, 80, 100);
          pdfCtx.strokeRect(100, 160, 280, 240);
          pdfCtx.strokeRect(380, 160, 320, 240);
          pdfCtx.fillText('会議室 A', 180, 285);
          pdfCtx.fillText('執務スペース', 480, 285);
          document.getElementById('pageIndicator').textContent = `${currentPage}/2`;
          applyScale(autoFitScale(800, 1100), false);
          centerCanvasScroll();
          subscribePageStrokes(pageKey);
          return;
        }

        if (doc.type === 'image' || doc.type === 'cad') {
          const img = new Image();
          img.onload = () => {
            pdfCanvas.width = img.width;
            pdfCanvas.height = img.height;
            drawCanvas.width = img.width;
            drawCanvas.height = img.height;
            pdfCtx.drawImage(img, 0, 0);

            if (doc.type === 'cad') {
              pdfCtx.fillStyle = 'rgba(15, 23, 42, 0.7)';
              pdfCtx.fillRect(20, 20, 240, 40);
              pdfCtx.fillStyle = '#38bdf8';
              pdfCtx.font = 'bold 16px sans-serif';
              pdfCtx.fillText('📐 CAD図面レイヤー', 35, 45);
            }

            applyScale(autoFitScale(img.width, img.height), false);
            centerCanvasScroll();
            document.getElementById('pageIndicator').textContent = `1/1`;
            subscribePageStrokes(pageKey);
          };
          img.src = doc.dataUrl;
          return;
        }

        if (doc.type === 'pdf') {
          try {
            const pdfInstance = await getPdfInstance();
            const page = await pdfInstance.getPage(currentPage);
            const viewport = page.getViewport({ scale: 1.5 });
            pdfCanvas.width = viewport.width;
            pdfCanvas.height = viewport.height;
            drawCanvas.width = viewport.width;
            drawCanvas.height = viewport.height;

            await page.render({ canvasContext: pdfCtx, viewport }).promise;
            document.getElementById('pageIndicator').textContent = `${currentPage}/${doc.numPages}`;

            applyScale(autoFitScale(viewport.width, viewport.height), false);
            centerCanvasScroll();
            subscribePageStrokes(pageKey);
          } catch (err) {
            console.error(err);
            pdfCanvas.width = 600;
            pdfCanvas.height = 800;
            drawCanvas.width = 600;
            drawCanvas.height = 800;
            pdfCtx.fillStyle = '#1e293b';
            pdfCtx.fillRect(0, 0, 600, 800);
            pdfCtx.fillStyle = '#ef4444';
            pdfCtx.font = '16px sans-serif';
            pdfCtx.textAlign = 'center';
            pdfCtx.fillText('PDFの読み込みに失敗しました', 300, 400);
            applyScale(autoFitScale(600, 800), false);
            centerCanvasScroll();
          }
        }
      }

      function trySnapToCircle(stroke) {
        if (stroke.tool !== 'pen' || !stroke.points || stroke.points.length < 14) return stroke;
        let pts = stroke.points;
        if (pts.length > 180) {
          const step = Math.ceil(pts.length / 180);
          const sampled = [];
          for (let i = 0; i < pts.length; i += step) sampled.push(pts[i]);
          sampled.push(pts[pts.length - 1]);
          pts = sampled;
        }

        const start = pts[0];
        const end = pts[pts.length - 1];

        let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
        for (let i = 0; i < pts.length; i++) {
          const p = pts[i];
          if (p.x < minX) minX = p.x;
          if (p.x > maxX) maxX = p.x;
          if (p.y < minY) minY = p.y;
          if (p.y > maxY) maxY = p.y;
        }

        const width = maxX - minX;
        const height = maxY - minY;
        const size = Math.max(width, height);
        if (size < 25) return stroke;

        const aspectRatio = Math.min(width, height) / size;
        if (aspectRatio < 0.72) return stroke;

        const closeDist = Math.hypot(end.x - start.x, end.y - start.y);
        if (closeDist > size * 0.25) return stroke;

        const cx = (minX + maxX) / 2;
        const cy = (minY + maxY) / 2;
        let sumR = 0;
        for (let i = 0; i < pts.length; i++) {
          sumR += Math.hypot(pts[i].x - cx, pts[i].y - cy);
        }
        const avgR = sumR / pts.length;

        let maxDev = 0;
        for (let i = 0; i < pts.length; i++) {
          const dev = Math.abs(Math.hypot(pts[i].x - cx, pts[i].y - cy) - avgR);
          if (dev > maxDev) maxDev = dev;
        }

        if (maxDev < avgR * 0.26) {
          return {
            tool: 'circle',
            color: stroke.color,
            width: stroke.width,
            cx: Math.round(cx),
            cy: Math.round(cy),
            r: Math.round(avgR)
          };
        }
        return stroke;
      }

      function renderStrokesToContext(ctx, strokes, showSelection = true) {
        strokes.forEach(s => {
          ctx.save();
          if (s.tool === 'image' && s.dataUrl) {
            const renderPhoto = (imgObj) => {
              ctx.drawImage(imgObj, s.x, s.y, s.width, s.height);
              if (showSelection && s.id === selectedImageId) {
                ctx.strokeStyle = '#38bdf8';
                ctx.lineWidth = 3;
                ctx.setLineDash([6, 4]);
                ctx.strokeRect(s.x, s.y, s.width, s.height);
              }
            };

            if (loadedImagesCache[s.id]) {
              renderPhoto(loadedImagesCache[s.id]);
            } else {
              const img = new Image();
              img.onload = () => {
                loadedImagesCache[s.id] = img;
                drawOverlay();
              };
              img.src = s.dataUrl;
            }
          } else {
            ctx.strokeStyle = s.color;
            ctx.fillStyle = s.color;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';

            if (s.tool === 'pen' || s.tool === 'marker') {
              ctx.globalAlpha = s.tool === 'marker' ? 0.35 : 1.0;
              ctx.lineWidth = s.tool === 'marker' ? s.width * 4 : s.width;
              ctx.beginPath();
              if (s.points) {
                s.points.forEach((pt, idx) => idx === 0 ? ctx.moveTo(pt.x, pt.y) : ctx.lineTo(pt.x, pt.y));
              }
              ctx.stroke();
            } else if (s.tool === 'circle') {
              ctx.lineWidth = s.width;
              ctx.beginPath();
              ctx.arc(s.cx, s.cy, s.r, 0, Math.PI * 2);
              ctx.stroke();
            } else if (s.tool === 'rect') {
              ctx.lineWidth = s.width;
              ctx.strokeRect(s.startX, s.startY, s.endX - s.startX, s.endY - s.startY);
            } else if (s.tool === 'text') {
              ctx.font = `bold ${Math.max(16, s.width * 4)}px sans-serif`;
              ctx.fillText(s.text, s.x, s.y);
            }
          }
          ctx.restore();
        });
      }

      function drawOverlay() {
        const ctx = drawCanvas.getContext('2d');
        ctx.clearRect(0, 0, drawCanvas.width, drawCanvas.height);
        const key = `${doc.id}_p${currentPage}`;
        const strokes = annotations[key] || [];
        renderStrokesToContext(ctx, strokes, true);
      }

      async function getStrokesForPage(pageNum) {
        const pageKey = `${doc.id}_p${pageNum}`;
        if (annotations[pageKey] && annotations[pageKey].length > 0) {
          return annotations[pageKey];
        }
        if (isCloudMode) {
          try {
            const snap = await db.collection('rooms').doc(ROOM_ID)
              .collection('annotations').doc(pageKey)
              .collection('strokes').orderBy('createdAt', 'asc').get();
            const list = [];
            snap.forEach(d => list.push({ id: d.id, ...d.data() }));
            annotations[pageKey] = list;
            return list;
          } catch (e) {
            console.error(e);
          }
        }
        return annotations[pageKey] || [];
      }

      async function preloadImagesInStrokes(strokes) {
        const targets = strokes.filter(s => s.tool === 'image' && s.dataUrl && !loadedImagesCache[s.id]);
        await Promise.all(targets.map(s => new Promise((resolve) => {
          const img = new Image();
          img.onload = () => {
            loadedImagesCache[s.id] = img;
            resolve();
          };
          img.onerror = () => resolve();
          img.src = s.dataUrl;
        })));
      }

      function triggerBlobDownload(blob, fileName) {
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = fileName;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        setTimeout(() => URL.revokeObjectURL(url), 1500);
      }

      async function renderPageToCanvas(pageNum) {
        const strokes = await getStrokesForPage(pageNum);
        await preloadImagesInStrokes(strokes);

        const outCanvas = document.createElement('canvas');
        const outCtx = outCanvas.getContext('2d');

        if (pageNum === currentPage) {
          outCanvas.width = pdfCanvas.width;
          outCanvas.height = pdfCanvas.height;
          outCtx.drawImage(pdfCanvas, 0, 0);
          renderStrokesToContext(outCtx, strokes, false);
          return outCanvas;
        }

        if (doc.type === 'sample') {
          outCanvas.width = 800;
          outCanvas.height = 1100;
          outCtx.fillStyle = '#ffffff';
          outCtx.fillRect(0, 0, 800, 1100);
          outCtx.strokeStyle = '#334155';
          outCtx.lineWidth = 3;
          outCtx.strokeRect(50, 50, 700, 1000);
          outCtx.fillStyle = '#0f172a';
          outCtx.font = 'bold 24px sans-serif';
          outCtx.fillText(`サンプル建築平面図 - ${pageNum}階`, 80, 100);
          outCtx.strokeRect(100, 160, 280, 240);
          outCtx.strokeRect(380, 160, 320, 240);
          outCtx.fillText('会議室 A', 180, 285);
          outCtx.fillText('執務スペース', 480, 285);
        } else if (doc.type === 'pdf') {
          const pdfInstance = await getPdfInstance();
          const page = await pdfInstance.getPage(pageNum);
          const viewport = page.getViewport({ scale: 1.5 });
          outCanvas.width = viewport.width;
          outCanvas.height = viewport.height;
          await page.render({ canvasContext: outCtx, viewport }).promise;
        } else {
          outCanvas.width = pdfCanvas.width;
          outCanvas.height = pdfCanvas.height;
          outCtx.drawImage(pdfCanvas, 0, 0);
        }

        renderStrokesToContext(outCtx, strokes, false);
        return outCanvas;
      }

      async function exportSinglePage(pageNum) {
        const baseName = doc.name.replace(/\.[^/.]+$/, "");
        const fileName = `${baseName}_p${pageNum}.png`;
        const canvas = await renderPageToCanvas(pageNum);

        await new Promise((resolve) => {
          canvas.toBlob((blob) => {
            if (blob) triggerBlobDownload(blob, fileName);
            resolve();
          }, 'image/png');
        });
      }

      const saveChoiceModal = document.getElementById('saveChoiceModal');
      const saveChoiceDesc = document.getElementById('saveChoiceDesc');

      document.getElementById('exportImageBtn').addEventListener('click', () => {
        flushCloudStrokes();
        const totalPages = doc.type === 'sample' ? 2 : (doc.numPages || 1);
        saveChoiceDesc.textContent = `現在 ${currentPage}/${totalPages} ページ目を表示中です。保存方法を選択してください。`;
        saveChoiceModal.classList.remove('hidden');
      });

      document.getElementById('cancelSaveChoiceBtn').addEventListener('click', () => {
        saveChoiceModal.classList.add('hidden');
      });

      document.getElementById('saveCurrentPageBtn').addEventListener('click', async () => {
        saveChoiceModal.classList.add('hidden');

          console.error(err);
          alert('画像の書き出しに失敗しました。');
        }
      });

      document.getElementById('saveAllPagesShareBtn').addEventListener('click', async () => {
        saveChoiceModal.classList.add('hidden');
        const totalPages = doc.type === 'sample' ? 2 : (doc.numPages || 1);
        const baseName = doc.name.replace(/\.[^/.]+$/, "");

        try {
          const files = [];
          for (let p = 1; p <= totalPages; p++) {
            const canvas = await renderPageToCanvas(p);
            const blob = await new Promise((resolve) => canvas.toBlob(resolve, 'image/png'));
            if (blob) {
              files.push(new File([blob], `${baseName}_p${p}.png`, { type: 'image/png' }));
            }
          }

          if (files.length > 0 && navigator.canShare && navigator.canShare({ files })) {
            await navigator.share({
              files,
              title: `${baseName}（全${totalPages}ページ）`
            });
            return;
          }

          for (let p = 0; p < files.length; p++) {
            triggerBlobDownload(files[p], files[p].name);
            if (p < files.length - 1) {
              await new Promise(r => setTimeout(r, 500));
            }
          }
          alert(`全 ${totalPages} ページの保存処理を実行しました。`);
        } catch (err) {
          if (err && err.name === 'AbortError') return;
          console.error(err);
          alert('一括保存中にエラーが発生しました。「1枚の縦長画像で保存」もお試しください。');
        }
      });

      document.getElementById('saveAllPagesMergedBtn').addEventListener('click', async () => {
        saveChoiceModal.classList.add('hidden');
        const totalPages = doc.type === 'sample' ? 2 : (doc.numPages || 1);
        const baseName = doc.name.replace(/\.[^/.]+$/, "");

        try {
          const canvases = [];
          let maxW = 0;
          let totalH = 0;
          const gap = 20;

          for (let p = 1; p <= totalPages; p++) {
            const c = await renderPageToCanvas(p);
            canvases.push(c);
            if (c.width > maxW) maxW = c.width;
            totalH += c.height;
          }
          totalH += gap * Math.max(0, canvases.length - 1);

          const mergedCanvas = document.createElement('canvas');
          mergedCanvas.width = maxW;
          mergedCanvas.height = totalH;
          const mergedCtx = mergedCanvas.getContext('2d');
          mergedCtx.fillStyle = '#0f172a';
          mergedCtx.fillRect(0, 0, maxW, totalH);

          let offsetY = 0;
          canvases.forEach((c) => {
            const offsetX = Math.floor((maxW - c.width) / 2);
            mergedCtx.drawImage(c, offsetX, offsetY);
            offsetY += c.height + gap;
          });

          await new Promise((resolve) => {
            mergedCanvas.toBlob((blob) => {
              if (blob) triggerBlobDownload(blob, `${baseName}_全${totalPages}ページ.png`);
              resolve();
            }, 'image/png');
          });
        } catch (err) {
          console.error(err);
          alert('結合画像の保存に失敗しました。');
        }
      });

      function saveAndRedraw(stroke) {
        const key = `${doc.id}_p${currentPage}`;
        if (!annotations[key]) annotations[key] = [];
        redoStack = [];

        const strokeId = 'st-' + Date.now() + '-' + Math.random().toString(36).substring(2, 6);
        stroke.id = strokeId;

        const payload = { ...stroke, createdAt: Date.now() };
        const serializedSize = JSON.stringify(payload).length;
        if (isCloudMode && serializedSize > 950000) {
          showQuotaExceededAlert('許容量を超えています。このデータはサイズが大きすぎるため保存できません。');
          return;
        }

        annotations[key].push(stroke);
        drawOverlay();

        if (isCloudMode) {
          pendingCloudStrokes.set(strokeId, { pageKey: key, strokeId, payload });
          if (pendingCloudSyncTimer) clearTimeout(pendingCloudSyncTimer);
          pendingCloudSyncTimer = setTimeout(flushCloudStrokes, 250);
        } else {
          const ok = saveAnnotationsData();
          if (!ok) {
            annotations[key] = annotations[key].filter(s => s.id !== strokeId);
            drawOverlay();
          }
        }
      }

      function persistStrokeUpdate(stroke) {
        const key = `${doc.id}_p${currentPage}`;
        if (isCloudMode) {
          const payload = { ...stroke, createdAt: stroke.createdAt || Date.now() };
          pendingCloudStrokes.set(stroke.id, { pageKey: key, strokeId: stroke.id, payload });
          if (pendingCloudSyncTimer) clearTimeout(pendingCloudSyncTimer);
          pendingCloudSyncTimer = setTimeout(flushCloudStrokes, 200);
        } else {
          saveAnnotationsData();
        }
      }

      document.getElementById('clearAllBtn').addEventListener('click', async () => {
        if (pendingCloudSyncTimer) clearTimeout(pendingCloudSyncTimer);
        pendingCloudStrokes.clear();

        const key = `${doc.id}_p${currentPage}`;
        const strokes = annotations[key] || [];
        if (strokes.length === 0) {
          alert('消去する書き込みがありません。');
          return;
        }

        if (!confirm('本当にこのページのすべての書き込みを削除しますか？\n（この操作は元に戻せません）')) {
          return;
        }

        annotations[key] = [];
        selectedImageId = null;
        drawOverlay();

        if (isCloudMode) {
          const batch = db.batch();
          const strokesRef = db.collection('rooms').doc(ROOM_ID)
            .collection('annotations').doc(key)
            .collection('strokes');

          const snap = await strokesRef.get();
          snap.forEach(d => {
            batch.delete(d.ref);
          });
          await batch.commit();
        } else {
          saveAnnotationsData();
        }
      });

      document.getElementById('prevPageBtn').addEventListener('click', () => {
        if (currentPage > 1) { currentPage--; selectedImageId = null; renderPage(); }
      });
      document.getElementById('nextPageBtn').addEventListener('click', () => {
        const max = doc.type === 'sample' ? 2 : (doc.numPages || 1);
        if (currentPage < max) { currentPage++; selectedImageId = null; renderPage(); }
      });

      document.getElementById('zoomInBtn').addEventListener('click', () => {
        applyScale(currentScale + 0.15, true);
      });
      document.getElementById('zoomOutBtn').addEventListener('click', () => {
        applyScale(currentScale - 0.15, true);
      });

      document.getElementById('undoBtn').addEventListener('click', async () => {
        flushCloudStrokes();
        const key = `${doc.id}_p${currentPage}`;
        const strokes = annotations[key];
        if (!strokes || strokes.length === 0) return;

        const popped = strokes.pop();
        if (popped.id === selectedImageId) selectedImageId = null;
        redoStack.push(popped);
        drawOverlay();

        if (isCloudMode) {
          await db.collection('rooms').doc(ROOM_ID)
            .collection('annotations').doc(key)
            .collection('strokes').doc(popped.id).delete();
        } else {
          saveAnnotationsData();
        }
      });

      document.getElementById('redoBtn').addEventListener('click', async () => {
        const key = `${doc.id}_p${currentPage}`;
        if (redoStack.length === 0) return;
        if (!annotations[key]) annotations[key] = [];

        const restored = redoStack.pop();
        annotations[key].push(restored);
        drawOverlay();

        try {
          if (isCloudMode) {
            const payload = { ...restored, createdAt: Date.now() };
            await db.collection('rooms').doc(ROOM_ID)
              .collection('annotations').doc(key)
              .collection('strokes').doc(restored.id).set(payload);
          } else {
            saveAnnotationsData();
          }
        } catch (err) {
          console.error(err);
          notifyIfQuotaExceeded(err);
        }
      });

      document.getElementById('addPhotoBtn').addEventListener('click', () => document.getElementById('photoFileInput').click());
      document.getElementById('photoFileInput').addEventListener('change', async (e) => {
        const file = e.target.files[0];
        if (!file) return;
        try {
          const dataUrl = await compressImageToTargetBytes(file, 500 * 1024);
          const img = new Image();
          img.onload = () => {
            const maxW = 220;
            const aspect = img.height / (img.width || 1);
            saveAndRedraw({
              tool: 'image',
              dataUrl: dataUrl,
              x: 100,
              y: 120,
              width: maxW,
              height: Math.round(maxW * aspect)
            });
            const panBtn = document.querySelector('.tool-btn[data-tool="pan"]');
            if (panBtn) panBtn.click();
          };
          img.src = dataUrl;
        } catch (err) {
          console.error(err);
          if (!notifyIfQuotaExceeded(err)) {
            alert('写真の読み込みに失敗しました。');
          }
        }
        e.target.value = '';
      });

      document.querySelectorAll('.tool-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          activeTool = btn.dataset.tool;
          if (activeTool !== 'pan') {
            selectedImageId = null;
            drawOverlay();
          }
          document.querySelectorAll('.tool-btn').forEach(b => {
            b.className = b === btn
              ? 'tool-btn active w-8 h-8 rounded-lg text-base flex items-center justify-center bg-blue-600 text-white shadow'
              : 'tool-btn w-8 h-8 rounded-lg text-base flex items-center justify-center text-slate-300 hover:bg-slate-800';
          });
          updateTouchAction();
        });
      });

      function updateTouchAction() {
        drawCanvas.style.touchAction = 'none';
        drawCanvas.style.pointerEvents = 'auto';
        drawCanvas.style.cursor = activeTool === 'pan' ? 'grab' : 'crosshair';
      }
      updateTouchAction();

      document.getElementById('colorPicker').addEventListener('input', e => currentColor = e.target.value);
      document.getElementById('lineWidthSelect').addEventListener('change', e => currentWidth = parseInt(e.target.value));

      let isDrawing = false;
      let currentStroke = null;
      let activePointerId = null;
      let draggingImage = null;
      let imageOffset = { x: 0, y: 0 };
      let isPanningScroll = false;
      let panStartClient = { x: 0, y: 0 };
      let panStartScroll = { left: 0, top: 0 };

      function findImageAtPos(pos) {
        const key = `${doc.id}_p${currentPage}`;
        const strokes = annotations[key] || [];
        for (let i = strokes.length - 1; i >= 0; i--) {
          const s = strokes[i];
          if (
            s.tool === 'image' &&
            pos.x >= s.x &&
            pos.x <= s.x + s.width &&
            pos.y >= s.y &&
            pos.y <= s.y + s.height
          ) {
            return s;
          }
        }
        return null;
      }

      drawCanvas.addEventListener('pointerdown', (e) => {
        if (isDrawing && currentStroke) {
          const prevStroke = currentStroke;
          isDrawing = false;
          currentStroke = null;
          saveAndRedraw(trySnapToCircle(prevStroke));
        }

        if (activePointerId !== null && activePointerId !== e.pointerId) {
          try { drawCanvas.releasePointerCapture(activePointerId); } catch (_) {}
        }
        activePointerId = e.pointerId;

        const rect = drawCanvas.getBoundingClientRect();
        const pos = {
          x: (e.clientX - rect.left) / currentScale,
          y: (e.clientY - rect.top) / currentScale
        };

        if (activeTool === 'pan') {
          const hitImg = findImageAtPos(pos);
          if (hitImg) {
            e.preventDefault();
            try { drawCanvas.setPointerCapture(e.pointerId); } catch (_) {}
            draggingImage = hitImg;
            selectedImageId = hitImg.id;
            imageOffset = {
              x: pos.x - hitImg.x,
              y: pos.y - hitImg.y
            };
            drawOverlay();
            return;
          }

          selectedImageId = null;
          drawOverlay();
          isPanningScroll = true;
          try { drawCanvas.setPointerCapture(e.pointerId); } catch (_) {}
          panStartClient = { x: e.clientX, y: e.clientY };
          panStartScroll = { left: canvasContainer.scrollLeft, top: canvasContainer.scrollTop };
          return;
        }

        e.preventDefault();
        try { drawCanvas.setPointerCapture(e.pointerId); } catch (_) {}

        const intPos = {
          x: Math.round(pos.x),
          y: Math.round(pos.y)
        };

        if (activeTool === 'text') {
          activePointerId = null;
          const text = prompt('テキストを入力:');
          if (text && text.trim()) {
            saveAndRedraw({ tool: 'text', color: currentColor, width: currentWidth, x: intPos.x, y: intPos.y, text: text.trim() });
          }
          return;
        }

        if (activeTool === 'eraser') {
          activePointerId = null;
          const key = `${doc.id}_p${currentPage}`;
          const strokes = annotations[key] || [];
          let targetId = null;
          strokes.forEach(s => {
            if (s.points && s.points.some(pt => Math.hypot(pt.x - intPos.x, pt.y - intPos.y) < 25)) targetId = s.id;
            else if (s.tool === 'circle' && Math.abs(Math.hypot(intPos.x - s.cx, intPos.y - s.cy) - s.r) < 25) targetId = s.id;
            else if (s.tool === 'image' && intPos.x >= s.x && intPos.x <= s.x + s.width && intPos.y >= s.y && intPos.y <= s.y + s.height) targetId = s.id;
          });
          if (targetId) {
            if (targetId === selectedImageId) selectedImageId = null;
            annotations[key] = annotations[key].filter(s => s.id !== targetId);
            drawOverlay();
            if (isCloudMode) {
              db.collection('rooms').doc(ROOM_ID)
                .collection('annotations').doc(key)
                .collection('strokes').doc(targetId).delete()
                .catch(err => console.error('Delete failed:', err));
            } else {
              saveAnnotationsData();
            }
          }
          return;
        }

        isDrawing = true;
        currentStroke = {
          tool: activeTool,
          color: currentColor,
          width: currentWidth,
          points: [intPos],
          startX: intPos.x,
          startY: intPos.y,
          endX: intPos.x,
          endY: intPos.y
        };
      });

      drawCanvas.addEventListener('pointermove', (e) => {
        if (activePointerId !== null && e.pointerId !== activePointerId) return;

        if (draggingImage) {
          e.preventDefault();
          const rect = drawCanvas.getBoundingClientRect();
          const posX = (e.clientX - rect.left) / currentScale;
          const posY = (e.clientY - rect.top) / currentScale;
          draggingImage.x = Math.round(posX - imageOffset.x);
          draggingImage.y = Math.round(posY - imageOffset.y);
          drawOverlay();
          return;
        }

        if (isPanningScroll) {
          e.preventDefault();
          const dx = e.clientX - panStartClient.x;
          const dy = e.clientY - panStartClient.y;
          canvasContainer.scrollLeft = panStartScroll.left - dx;
          canvasContainer.scrollTop = panStartScroll.top - dy;
          return;
        }

        if (activeTool === 'pan' || !isDrawing || !currentStroke) return;
        e.preventDefault();

        const rect = drawCanvas.getBoundingClientRect();
        const pos = {
          x: Math.round((e.clientX - rect.left) / currentScale),
          y: Math.round((e.clientY - rect.top) / currentScale)
        };

        if (currentStroke.tool === 'pen' || currentStroke.tool === 'marker') {
          const lastPt = currentStroke.points[currentStroke.points.length - 1];
          if (!lastPt || Math.hypot(pos.x - lastPt.x, pos.y - lastPt.y) >= 1) {
            currentStroke.points.push(pos);
          }
        } else if (currentStroke.tool === 'rect') {
          currentStroke.endX = pos.x;
          currentStroke.endY = pos.y;
        }

        drawOverlay();
        const ctx = drawCanvas.getContext('2d');
        ctx.save();
        ctx.strokeStyle = currentStroke.color;
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        if (currentStroke.tool === 'pen' || currentStroke.tool === 'marker') {
          ctx.globalAlpha = currentStroke.tool === 'marker' ? 0.35 : 1.0;
          ctx.lineWidth = currentStroke.tool === 'marker' ? currentStroke.width * 4 : currentStroke.width;
          ctx.beginPath();
          currentStroke.points.forEach((pt, idx) => idx === 0 ? ctx.moveTo(pt.x, pt.y) : ctx.lineTo(pt.x, pt.y));
          ctx.stroke();
        } else if (currentStroke.tool === 'rect') {
          ctx.lineWidth = currentStroke.width;
          ctx.strokeRect(currentStroke.startX, currentStroke.startY, currentStroke.endX - currentStroke.startX, currentStroke.endY - currentStroke.startY);
        }
        ctx.restore();
      });

      function finishPointerInteraction(pointerId) {
        if (pointerId !== undefined && drawCanvas.hasPointerCapture(pointerId)) {
          try { drawCanvas.releasePointerCapture(pointerId); } catch (_) {}
        }
        if (activePointerId === pointerId || pointerId === undefined) {
          activePointerId = null;
        }

        if (draggingImage) {
          const movedImg = draggingImage;
          draggingImage = null;
          persistStrokeUpdate(movedImg);
          return;
        }

        if (isPanningScroll) {
          isPanningScroll = false;
          return;
        }

        if (activeTool === 'pan' || !isDrawing || !currentStroke) return;
        isDrawing = false;
        const strokeToSave = currentStroke;
        currentStroke = null;

        const finalStroke = trySnapToCircle(strokeToSave);
        saveAndRedraw(finalStroke);
      }

      drawCanvas.addEventListener('pointerup', (e) => {
        finishPointerInteraction(e.pointerId);
      });

      drawCanvas.addEventListener('pointercancel', (e) => {
        finishPointerInteraction(e.pointerId);
      });

      renderPage();
    }

    renderBrowser();
  </script>
</body>
</html>
