<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>PDF & Image Sync Board - 完全安定版</title>
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#0f172a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="PDF Board">
  <link rel="apple-touch-icon" href="./icon-512.png">

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script>
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  </script>
  <style>
    html, body {
      position: fixed;
      inset: 0;
      overflow: hidden;
      overscroll-behavior: none;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }
    .canvas-container {
      touch-action: pan-x pan-y;
      box-sizing: border-box;
    }
    .canvas-scroll-inner {
      display: table;
      width: 100%;
      height: 100%;
    }
    .canvas-scroll-cell {
      display: table-cell;
      vertical-align: middle;
      text-align: center;
      padding: 48px;
    }
    #canvasScaleBox {
      display: inline-block;
      text-align: left;
      vertical-align: middle;
    }
    #passwordModal, input, button, select {
      touch-action: manipulation;
    }
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #0f172a;
    }
    ::-webkit-scrollbar-thumb {
      background: #334155;
      border-radius: 3px;
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 h-screen w-screen overflow-hidden flex flex-col font-sans">

  <!-- Password Protection Modal -->
  <div id="passwordModal" class="fixed inset-0 bg-slate-950/90 backdrop-blur-md flex items-center justify-center z-50 p-4">
    <div class="bg-slate-900 border border-slate-800 rounded-2xl max-w-sm w-full p-6 shadow-2xl space-y-4">
      <div class="text-center space-y-1">
        <span class="text-3xl">🔒</span>
        <h2 class="font-bold text-lg text-white">パスワード認証</h2>
        <p class="text-xs text-slate-400">このワークスペースに入るためのパスワードを入力してください</p>
      </div>
      <form id="passwordForm" class="space-y-3">
        <input type="password" id="roomPasswordInput" inputmode="numeric" pattern="[0-9]*" placeholder="パスワードを入力 (数字)" required class="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-blue-500 text-center tracking-widest text-lg" />
        <p id="passwordError" class="text-xs text-red-400 hidden text-center">パスワードが間違っています</p>
        <button type="submit" class="w-full py-2.5 bg-blue-600 hover:bg-blue-500 text-white font-bold text-xs rounded-xl shadow transition">
          入室する
        </button>
      </form>
    </div>
  </div>

  <!-- App Main Container (一覧・フォルダ画面) -->
  <div id="appContainer" class="flex-1 flex flex-col overflow-hidden relative">
    <!-- Top Header -->
    <header class="h-14 bg-slate-900 border-b border-slate-800 px-3 flex items-center justify-between shrink-0 z-20">
      <div class="flex items-center gap-2.5">
        <button id="toggleSidebarBtn" class="p-2 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-200" title="サイドバー切替">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/></svg>
        </button>
        <div class="flex items-center gap-2">
          <span class="bg-blue-600 text-white font-bold px-2 py-0.5 rounded text-sm">PDF/IMG</span>
          <h1 class="font-bold text-base tracking-tight hidden sm:block">Sync Board</h1>
        </div>
        <span id="syncStatusBadge" class="text-xs px-2.5 py-1 rounded-full bg-amber-500/20 text-amber-300 border border-amber-500/30 flex items-center gap-1.5">
          <span class="w-2 h-2 rounded-full bg-amber-400"></span>
          <span>ローカル保存</span>
        </span>
      </div>

      <div class="flex items-center gap-2">
        <div id="activeUsersIndicator" class="hidden sm:flex items-center gap-1.5 bg-slate-800/80 px-2.5 py-1 rounded-lg border border-slate-700 text-[11px] text-slate-300">
          <span>👥 接続中:</span><span id="activeUsersCount" class="font-bold text-emerald-400">1人</span>
        </div>
        <button id="shareRoomBtn" class="px-3 py-1.5 bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-semibold rounded-lg flex items-center gap-1.5 shadow">
          <span>🔗</span><span class="hidden sm:inline">URL共有</span>
        </button>
      </div>
    </header>

    <!-- Main Body -->
    <div class="flex-1 flex overflow-hidden relative">
      <!-- Left Sidebar (Folders & Files) -->
      <aside id="sidebar" class="w-80 sm:w-96 bg-slate-900 border-r border-slate-800 flex flex-col shrink-0 transition-all duration-200 z-10">
        <div class="p-3 border-b border-slate-800 flex flex-col gap-2">
          <button id="addImageDocBtn" class="w-full py-2.5 px-3 bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-bold rounded-lg flex items-center justify-center gap-2 shadow transition">
            <span>📷 画像 / PDF / 図面追加</span>
          </button>
          <input type="file" id="localImageInput" class="hidden" multiple accept="image/*,application/pdf,.zwd,.zfd" />
          <div class="flex gap-1.5">
            <button id="createFolderBtn" class="flex-1 py-1.5 px-2 bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs rounded-lg border border-slate-700 flex items-center justify-center gap-1">
              <span>📁</span><span>新規フォルダ</span>
            </button>
            <button id="clearStorageBtn" class="py-1.5 px-2.5 bg-slate-800 hover:bg-slate-700 text-red-400 text-xs rounded-lg border border-slate-700" title="保存データをリセット">
              🔄
            </button>
          </div>
          <p class="text-[10px] text-slate-400 text-center">※ファイルやフォルダはドラッグまたは↑↓ボタンで順序変更できます</p>
        </div>

        <!-- Folder & Document Tree -->
        <div id="folderListContainer" class="flex-1 overflow-y-auto p-2 space-y-2">
          <!-- Rendered by JS -->
        </div>

        <div class="p-2.5 border-t border-slate-800 text-[11px] text-slate-400 flex justify-between items-center bg-slate-900/80">
          <span id="roomLabel">Room: default</span>
          <span id="docCountLabel">0 ファイル</span>
        </div>
      </aside>

      <!-- Workspace Home / Guide -->
      <main id="mainWorkspaceArea" class="flex-1 bg-slate-950 flex flex-col items-center justify-center p-6 text-center text-slate-400 space-y-3">
        <div class="text-5xl">📂</div>
        <h2 class="text-lg font-bold text-white">図面を選択してください</h2>
        <p class="text-xs max-w-sm leading-relaxed">左側のファイル一覧から確認したいPDFや画像・CAD図面をタップすると、専用のフルスクリーン編集画面に切り替わります。</p>
      </main>
    </div>
  </div>

  <!-- Viewer Container (図面操作画面) -->
  <div id="viewerContainer" class="hidden fixed inset-0 z-40 bg-slate-950 text-slate-100 flex flex-col overflow-hidden"></div>

  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

  <script>
    const APP_PASSWORD = "0909";

    const FIREBASE_CONFIG = {
      apiKey: "AIzaSyDuVRjuskinN49x36sB0TmfxD7NNshTT8",
      authDomain: "oozora12326-91d3d.firebaseapp.com",
      projectId: "oozora12326-91d3d",
      storageBucket: "oozora12326-91d3d.firebasestorage.app",
      messagingSenderId: "381951638605",
      appId: "1:381951638605:web:49269c22fbe41397dfb004",
      measurementId: "G-LL2YZVV52S"
    };

    const USER_CLIENT_ID = 'user-' + Math.random().toString(36).substring(2, 9);

    window.addEventListener('DOMContentLoaded', () => {
      if (sessionStorage.getItem('auth_passed') === 'true') {
        document.getElementById('passwordModal').style.display = 'none';
        initApp();
      }
    });

    document.getElementById('passwordForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const inputVal = document.getElementById('roomPasswordInput').value;
      if (inputVal === APP_PASSWORD) {
        sessionStorage.setItem('auth_passed', 'true');
        document.getElementById('passwordModal').style.display = 'none';
        initApp();
      } else {
        document.getElementById('passwordError').classList.remove('hidden');
      }
    });

    const urlParams = new URLSearchParams(window.location.search);
    const ROOM_ID = urlParams.get('room') || 'default-room';
    document.getElementById('roomLabel').textContent = `Room: ${ROOM_ID}`;

    let db = null;
    let isCloudMode = false;
    let currentStrokeUnsubscribe = null;
    let resizeHandler = null;

    function initApp() {
      if (FIREBASE_CONFIG.apiKey && FIREBASE_CONFIG.projectId) {
        try {
          if (!firebase.apps.length) {
            firebase.initializeApp(FIREBASE_CONFIG);
          }
          db = firebase.firestore();
          isCloudMode = true;
          const badge = document.getElementById('syncStatusBadge');
          badge.className = "text-xs px-2.5 py-1 rounded-full bg-emerald-500/20 text-emerald-300 border border-emerald-500/30 flex items-center gap-1.5";
          badge.innerHTML = `<span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span><span>クラウド (高速同期)</span>`;

          setInterval(updatePresence, 10000);
          updatePresence();
        } catch (e) {
          console.error("Firebase init failed:", e);
        }
      }
      initCloudListeners();
    }

    async function updatePresence(currentDocId = null, currentPageNum = null) {
      if (!isCloudMode) return;
      try {
        await db.collection('rooms').doc(ROOM_ID).collection('presence').doc(USER_CLIENT_ID).set({
          lastSeen: firebase.firestore.FieldValue.serverTimestamp(),
          viewingDoc: currentDocId,
          page: currentPageNum
        }, { merge: true });
      } catch(e) { console.error(e); }
    }

    const STORAGE_KEY_STATE = 'pdf_sync_board_state_v5';
    const STORAGE_KEY_ANNOTATIONS = 'pdf_sync_board_annotations_v3';

    const defaultState = {
      folders: [
        { id: 'folder-default', name: '未分類・図面一式', parentId: null, order: 0, collapsed: false }
      ],
      documents: [
        {
          id: 'sample-plan-01',
          name: 'サンプル平面図_1F.pdf',
          folderId: 'folder-default',
          type: 'sample',
          order: 0,
          numPages: 2
        }
      ]
    };

    let state = loadState();
    let annotations = loadAnnotations();

    function loadState() {
      const saved = localStorage.getItem(STORAGE_KEY_STATE);
      if (saved) {
        try { return JSON.parse(saved); } catch(e) { console.error(e); }
      }
      return defaultState;
    }

    function saveState() {
      if (!isCloudMode) {
        localStorage.setItem(STORAGE_KEY_STATE, JSON.stringify(state));
      }
    }

    function loadAnnotations() {
      const saved = localStorage.getItem(STORAGE_KEY_ANNOTATIONS);
      if (saved) {
        try { return JSON.parse(saved); } catch(e) { console.error(e); }
      }
      return {};
    }

    function saveAnnotationsData() {
      if (!isCloudMode) {
        localStorage.setItem(STORAGE_KEY_ANNOTATIONS, JSON.stringify(annotations));
      }
    }

    document.getElementById('clearStorageBtn').addEventListener('click', () => {
      if (confirm('ローカルに保存されたデータを初期化しますか？')) {
        localStorage.removeItem(STORAGE_KEY_STATE);
        localStorage.removeItem(STORAGE_KEY_ANNOTATIONS);
        location.reload();
      }
    });

    document.getElementById('shareRoomBtn').addEventListener('click', () => {
      const shareUrl = window.location.origin + window.location.pathname + '?room=' + ROOM_ID;
      if (navigator.clipboard) {
        navigator.clipboard.writeText(shareUrl).then(() => {
          alert('共有用URLをクリップボードにコピーしました！\n別の端末やブラウザに貼り付けて開いてください。');
        });
      } else {
        prompt('このURLをコピーしてください:', shareUrl);
      }
    });

    document.getElementById('toggleSidebarBtn').addEventListener('click', () => {
      const sidebar = document.getElementById('sidebar');
      sidebar.classList.toggle('hidden');
    });

    function initCloudListeners() {
      if (!isCloudMode) {
        renderSidebar();
        return;
      }

      const roomRef = db.collection('rooms').doc(ROOM_ID);

      roomRef.collection('folders').onSnapshot(snap => {
        const existingDefault = state.folders.find(f => f.id === 'folder-default');
        let defaultFolder = existingDefault || {
          id: 'folder-default', name: '未分類・図面一式', parentId: null, order: 0, collapsed: false
        };

        const list = [];
        snap.forEach(doc => {
          const d = doc.data();
          const existing = state.folders.find(f => f.id === doc.id);
          if (doc.id === 'folder-default') {
            defaultFolder = {
              id: 'folder-default',
              name: d.name || '未分類・図面一式',
              parentId: d.parentId || null,
              order: d.order !== undefined ? d.order : 0,
              collapsed: existing ? existing.collapsed : false
            };
          } else {
            list.push({
              id: doc.id,
              name: d.name,
              parentId: d.parentId || null,
              order: d.order !== undefined ? d.order : 999,
              collapsed: existing ? existing.collapsed : false
            });
          }
        });

        list.push(defaultFolder);
        list.sort((a, b) => (a.order || 0) - (b.order || 0));
        state.folders = list;
        renderSidebar();
      });

      roomRef.collection('documents').onSnapshot(snap => {
        const docsList = [];
        snap.forEach(docSnap => {
          const data = docSnap.data();
          docsList.push({
            id: docSnap.id,
            name: data.name,
            folderId: data.folderId || 'folder-default',
            type: data.type || 'pdf',
            dataUrl: data.dataUrl || null,
            order: data.order !== undefined ? data.order : 999,
            numPages: 1
          });
        });
        docsList.sort((a, b) => (a.order || 0) - (b.order || 0));
        state.documents = docsList;
        renderSidebar();
      });

      roomRef.collection('presence').onSnapshot(snap => {
        let count = 0;
        const now = Date.now();
        snap.forEach(doc => {
          const data = doc.data();
          if (data.lastSeen && (now - data.lastSeen.toMillis() < 30000)) {
            count++;
          }
        });
        const countEl = document.getElementById('activeUsersCount');
        if (countEl) {
          countEl.textContent = `${Math.max(1, count)}人`;
        }
      });
    }

    async function createFolder(parentId = null) {
      const promptTitle = parentId
        ? 'このフォルダ内に作成するサブフォルダ名を入力してください:'
        : '新しいフォルダ名を入力してください:';
      const defaultName = parentId ? 'サブフォルダ' : '施工図・電気設備';
      const name = prompt(promptTitle, defaultName);
      if (!name || !name.trim()) return;

      const siblings = state.folders.filter(f => (f.parentId || null) === parentId);
      const newOrder = siblings.length > 0 ? Math.max(...siblings.map(f => f.order || 0)) + 1 : 0;

      if (isCloudMode) {
        await db.collection('rooms').doc(ROOM_ID).collection('folders').add({
          name: name.trim(),
          parentId: parentId,
          order: newOrder,
          createdAt: firebase.firestore.FieldValue.serverTimestamp()
        });
      } else {
        state.folders.push({
          id: 'folder-' + Date.now(),
          name: name.trim(),
          parentId: parentId,
          order: newOrder,
          collapsed: false
        });
        saveState();
        renderSidebar();
      }
    }

    document.getElementById('createFolderBtn').addEventListener('click', () => createFolder(null));

    // =========================================================================
    // フォルダ ＆ 書類の並び替え・移動ロジック
    // =========================================================================
    async function saveFoldersOrderToStore() {
      if (isCloudMode) {
        const batch = db.batch();
        state.folders.forEach(f => {
          const ref = db.collection('rooms').doc(ROOM_ID).collection('folders').doc(f.id);
          batch.set(ref, {
            name: f.name,
            order: f.order,
            parentId: f.parentId || null
          }, { merge: true });
        });
        await batch.commit();
      } else {
        saveState();
        renderSidebar();
      }
    }

    async function handleFolderDrop(draggedId, targetId, dropMode) {
      if (draggedId === targetId) return;
      const draggedFolder = state.folders.find(f => f.id === draggedId);
      const targetFolder = state.folders.find(f => f.id === targetId);
      if (!draggedFolder || !targetFolder) return;

      const descendants = getDescendantFolderIds(draggedId);
      if (descendants.includes(targetId)) return;

      if (dropMode === 'inside') {
        draggedFolder.parentId = targetFolder.id;
        const siblings = state.folders.filter(f => (f.parentId || null) === targetFolder.id && f.id !== draggedId);
        draggedFolder.order = siblings.length;
        siblings.push(draggedFolder);
        siblings.forEach((f, idx) => f.order = idx);
      } else {
        const newParentId = targetFolder.parentId || null;
        draggedFolder.parentId = newParentId;

        const siblings = state.folders
          .filter(f => (f.parentId || null) === newParentId && f.id !== draggedId)
          .sort((a, b) => (a.order || 0) - (b.order || 0));

        let targetIdx = siblings.findIndex(f => f.id === targetId);
        if (targetIdx === -1) targetIdx = siblings.length;
        if (dropMode === 'after') targetIdx += 1;

        siblings.splice(targetIdx, 0, draggedFolder);
        siblings.forEach((f, idx) => f.order = idx);
      }

      state.folders.sort((a, b) => (a.order || 0) - (b.order || 0));
      await saveFoldersOrderToStore();
    }

    async function moveDocToFolder(docId, folderId) {
      const docsInTarget = state.documents
        .filter(d => d.folderId === folderId && d.id !== docId)
        .sort((a, b) => (a.order || 0) - (b.order || 0));
      const newOrder = docsInTarget.length;

      if (isCloudMode) {
        await db.collection('rooms').doc(ROOM_ID).collection('documents').doc(docId).update({
          folderId,
          order: newOrder
        });
      } else {
        const doc = state.documents.find(d => d.id === docId);
        if (doc) {
          doc.folderId = folderId;
          doc.order = newOrder;
        }
        saveState();
        renderSidebar();
      }
    }

    async function reorderDocument(draggedDocId, targetDocId, dropAfter = false) {
      if (draggedDocId === targetDocId) return;
      const draggedDoc = state.documents.find(d => d.id === draggedDocId);
      const targetDoc = state.documents.find(d => d.id === targetDocId);
      if (!draggedDoc || !targetDoc) return;

      const targetFolderId = targetDoc.folderId;
      draggedDoc.folderId = targetFolderId;

      const folderDocs = state.documents
        .filter(d => d.folderId === targetFolderId && d.id !== draggedDocId)
        .sort((a, b) => (a.order || 0) - (b.order || 0));

      let targetIndex = folderDocs.findIndex(d => d.id === targetDocId);
      if (targetIndex === -1) targetIndex = folderDocs.length;
      if (dropAfter) targetIndex += 1;

      folderDocs.splice(targetIndex, 0, draggedDoc);
      folderDocs.forEach((d, idx) => d.order = idx);

      if (isCloudMode) {
        const batch = db.batch();
        folderDocs.forEach(d => {
          const ref = db.collection('rooms').doc(ROOM_ID).collection('documents').doc(d.id);
          batch.update(ref, { order: d.order, folderId: d.folderId });
        });
        await batch.commit();
      } else {
        saveState();
        renderSidebar();
      }
    }

    async function shiftDocumentOrder(docId, direction) {
      const targetDoc = state.documents.find(d => d.id === docId);
      if (!targetDoc) return;

      const folderDocs = state.documents
        .filter(d => d.folderId === targetDoc.folderId)
        .sort((a, b) => (a.order || 0) - (b.order || 0));

      const idx = folderDocs.findIndex(d => d.id === docId);
      const swapIdx = idx + direction;
      if (idx === -1 || swapIdx < 0 || swapIdx >= folderDocs.length) return;

      const temp = folderDocs[idx];
      folderDocs[idx] = folderDocs[swapIdx];
      folderDocs[swapIdx] = temp;

      folderDocs.forEach((d, i) => d.order = i);

      if (isCloudMode) {
        const batch = db.batch();
        folderDocs.forEach(d => {
          const ref = db.collection('rooms').doc(ROOM_ID).collection('documents').doc(d.id);
          batch.update(ref, { order: d.order });
        });
        await batch.commit();
      } else {
        saveState();
        renderSidebar();
      }
    }

    async function shiftFolderOrder(folderId, direction) {
      const targetFolder = state.folders.find(f => f.id === folderId);
      if (!targetFolder) return;

      const parentId = targetFolder.parentId || null;
      const siblings = state.folders
        .filter(f => (f.parentId || null) === parentId)
        .sort((a, b) => (a.order || 0) - (b.order || 0));

      const idx = siblings.findIndex(f => f.id === folderId);
      const swapIdx = idx + direction;
      if (idx === -1 || swapIdx < 0 || swapIdx >= siblings.length) return;

      const temp = siblings[idx];
      siblings[idx] = siblings[swapIdx];
      siblings[swapIdx] = temp;

      siblings.forEach((f, i) => f.order = i);
      state.folders.sort((a, b) => (a.order || 0) - (b.order || 0));

      await saveFoldersOrderToStore();
    }

    document.getElementById('addImageDocBtn').addEventListener('click', () => {
      document.getElementById('localImageInput').click();
    });

    // ファイル追加処理：同期の競合を防ぐためawaitで確実に保存完了を待つように修正
    document.getElementById('localImageInput').addEventListener('change', async (e) => {
      const files = e.target.files;
      if (!files || files.length === 0) return;

      const defaultDocs = state.documents.filter(d => d.folderId === 'folder-default');
      let nextOrder = defaultDocs.length > 0 ? Math.max(...defaultDocs.map(d => d.order || 0)) + 1 : 0;

      for (const file of files) {
        await new Promise((resolve) => {
          const reader = new FileReader();
          reader.onload = async (event) => {
            const dataUrl = event.target.result;
            const docName = file.name;
            const lowerName = file.name.toLowerCase();

            let fileType = 'image';
            if (lowerName.endsWith('.pdf')) {
              fileType = 'pdf';
            } else if (lowerName.endsWith('.zwd') || lowerName.endsWith('.zfd')) {
              fileType = 'cad';
            }

            if (isCloudMode) {
              await db.collection('rooms').doc(ROOM_ID).collection('documents').add({
                name: docName,
                folderId: 'folder-default',
                type: fileType,
                dataUrl: dataUrl,
                order: nextOrder++,
                createdAt: firebase.firestore.FieldValue.serverTimestamp()
              });
            } else {
              const newId = 'doc-' + Date.now() + '-' + Math.random().toString(36).substring(2, 6);
              state.documents.push({
                id: newId,
                name: docName,
                folderId: 'folder-default',
                type: fileType,
                dataUrl: dataUrl,
                order: nextOrder++,
                numPages: 1
              });
              saveState();
              renderSidebar();
            }
            resolve();
          };
          reader.readAsDataURL(file);
        });
      }
      e.target.value = '';
    });

    function getDescendantFolderIds(folderId) {
      let ids = [folderId];
      const children = state.folders.filter(f => f.parentId === folderId);
      children.forEach(c => {
        ids = ids.concat(getDescendantFolderIds(c.id));
      });
      return ids;
    }

    function getFlatFolderOptions(parentId = null, depth = 0) {
      let options = [];
      const children = state.folders
        .filter(f => (f.parentId || null) === parentId)
        .sort((a, b) => (a.order || 0) - (b.order || 0));

      children.forEach(f => {
        const prefix = depth > 0 ? ' '.repeat(depth) + '└ ' : '';
        options.push({ id: f.id, label: `${prefix}📁 ${f.name}` });
        options = options.concat(getFlatFolderOptions(f.id, depth + 1));
      });
      return options;
    }

    function createDocItemElement(doc, docIndex, totalDocs, flatOptions, isSubFolder = false) {
      const item = document.createElement('div');
      item.draggable = true;
      item.className = isSubFolder
        ? 'p-2 rounded-lg bg-slate-950 hover:bg-slate-800/80 border border-slate-700/80 flex flex-col gap-1.5 transition cursor-pointer shadow-sm relative'
        : 'p-2.5 rounded-lg bg-slate-900 hover:bg-slate-800/80 border border-slate-700/80 flex flex-col gap-2 transition cursor-pointer shadow-sm relative';

      item.addEventListener('dragstart', e => {
        e.stopPropagation();
        e.dataTransfer.setData('text/plain', doc.id);
      });

      item.addEventListener('dragover', e => {
        e.preventDefault();
        e.stopPropagation();
        const rect = item.getBoundingClientRect();
        const isBottomHalf = (e.clientY - rect.top) > rect.height / 2;
        item.style.borderTop = isBottomHalf ? '' : '3px solid #10b981';
        item.style.borderBottom = isBottomHalf ? '3px solid #10b981' : '';
      });

      item.addEventListener('dragleave', e => {
        e.stopPropagation();
        item.style.borderTop = '';
        item.style.borderBottom = '';
      });

      item.addEventListener('drop', e => {
        e.preventDefault();
        e.stopPropagation();
        const rect = item.getBoundingClientRect();
        const isBottomHalf = (e.clientY - rect.top) > rect.height / 2;
        item.style.borderTop = '';
        item.style.borderBottom = '';

        const draggedDocId = e.dataTransfer.getData('text/plain');
        if (draggedDocId && draggedDocId !== doc.id) {
          reorderDocument(draggedDocId, doc.id, isBottomHalf);
        }
      });

      const folderOptions = flatOptions.map(opt =>
        `<option value="${opt.id}" ${opt.id === doc.folderId ? 'selected' : ''}>${opt.label}</option>`
      ).join('');

      let icon = '📄';
      if (doc.type === 'image') icon = '🖼️';
      if (doc.type === 'cad') icon = '📐';

      const upDisabled = docIndex === 0 ? 'opacity-30 pointer-events-none' : 'hover:bg-slate-700';
      const downDisabled = docIndex === totalDocs - 1 ? 'opacity-30 pointer-events-none' : 'hover:bg-slate-700';

      item.innerHTML = `
        <div class="flex items-center justify-between gap-1">
          <span class="cursor-grab text-slate-500 text-xs pr-0.5" title="ドラッグで順番入替">☰</span>
          <span class="text-xs font-bold text-slate-100 truncate flex-1">${icon} ${doc.name}</span>
          <div class="flex items-center gap-0.5 shrink-0">
            <button class="doc-up-btn px-1.5 py-0.5 bg-slate-800 text-slate-300 rounded text-[10px] ${upDisabled}" title="上へ">↑</button>
            <button class="doc-down-btn px-1.5 py-0.5 bg-slate-800 text-slate-300 rounded text-[10px] ${downDisabled}" title="下へ">↓</button>
          </div>
          <span class="text-[11px] bg-blue-600 text-white px-2 py-0.5 rounded font-semibold shrink-0 ml-0.5">開く ➔</span>
          <button class="delete-doc-btn px-1.5 py-0.5 bg-red-600/20 hover:bg-red-600 text-red-300 hover:text-white rounded text-[10px] shrink-0" title="削除">🗑️</button>
        </div>
        <select class="move-folder-select w-full bg-slate-950 text-[10px] text-slate-400 rounded px-1.5 py-1 border border-slate-800">
          ${folderOptions}
        </select>
      `;

      item.addEventListener('click', (e) => {
        if (
          e.target.tagName === 'SELECT' ||
          e.target.tagName === 'OPTION' ||
          e.target.closest('.delete-doc-btn') ||
          e.target.closest('.doc-up-btn') ||
          e.target.closest('.doc-down-btn')
        ) return;
        openViewer(doc.id);
      });

      item.querySelector('.doc-up-btn').addEventListener('click', (e) => {
        e.stopPropagation();
        shiftDocumentOrder(doc.id, -1);
      });

      item.querySelector('.doc-down-btn').addEventListener('click', (e) => {
        e.stopPropagation();
        shiftDocumentOrder(doc.id, 1);
      });

      item.querySelector('.move-folder-select').addEventListener('change', e => {
        moveDocToFolder(doc.id, e.target.value);
      });

      item.querySelector('.delete-doc-btn').addEventListener('click', async (e) => {
        e.stopPropagation();
        if (!confirm(`「${doc.name}」を削除しますか？`)) return;
        if (isCloudMode) {
          await db.collection('rooms').doc(ROOM_ID).collection('documents').doc(doc.id).delete();
        } else {
          state.documents = state.documents.filter(d => d.id !== doc.id);
          saveState();
          renderSidebar();
        }
      });

      return item;
    }

    function getFolderDropMode(element, clientY) {
      const rect = element.getBoundingClientRect();
      const relY = clientY - rect.top;
      const ratio = relY / rect.height;
      if (ratio < 0.28) return 'before';
      if (ratio > 0.72) return 'after';
      return 'inside';
    }

    function applyFolderDropIndicator(element, mode) {
      element.style.borderTop = '';
      element.style.borderBottom = '';
      element.classList.remove('ring-2', 'ring-blue-500');
      if (mode === 'before') {
        element.style.borderTop = '3px solid #38bdf8';
      } else if (mode === 'after') {
        element.style.borderBottom = '3px solid #38bdf8';
      } else {
        element.classList.add('ring-2', 'ring-blue-500');
      }
    }

    function clearFolderDropIndicator(element) {
      element.style.borderTop = '';
      element.style.borderBottom = '';
      element.classList.remove('ring-2', 'ring-blue-500');
    }

    function renderSidebar() {
      const container = document.getElementById('folderListContainer');
      container.innerHTML = '';
      document.getElementById('docCountLabel').textContent = `${state.documents.length} ファイル`;

      state.folders.sort((a, b) => (a.order || 0) - (b.order || 0));
      const flatOptions = getFlatFolderOptions(null, 0);

      function renderFolderTree(parentId, depth = 0) {
        const foldersAtLevel = state.folders.filter(f => (f.parentId || null) === parentId);

        foldersAtLevel.forEach((folder, folderIdx) => {
          const docsInFolder = state.documents
            .filter(d => d.folderId === folder.id)
            .sort((a, b) => (a.order || 0) - (b.order || 0));
          const childFolders = state.folders.filter(f => f.parentId === folder.id);

          const folderEl = document.createElement('div');
          folderEl.className = depth === 0
            ? 'bg-slate-800/60 border border-slate-800 rounded-xl overflow-hidden transition-all'
            : 'bg-slate-900/80 border border-slate-700/80 rounded-lg overflow-hidden transition-all mt-1.5';
          folderEl.draggable = true;

          folderEl.addEventListener('dragstart', e => {
            e.stopPropagation();
            e.dataTransfer.setData('text/folder-id', folder.id);
          });

          folderEl.addEventListener('dragover', e => {
            e.preventDefault();
            e.stopPropagation();
            const mode = getFolderDropMode(folderEl, e.clientY);
            applyFolderDropIndicator(folderEl, mode);
          });

          folderEl.addEventListener('dragleave', e => {
            e.stopPropagation();
            clearFolderDropIndicator(folderEl);
          });

          folderEl.addEventListener('drop', e => {
            e.preventDefault();
            e.stopPropagation();
            const mode = getFolderDropMode(folderEl, e.clientY);
            clearFolderDropIndicator(folderEl);

            const draggedFolderId = e.dataTransfer.getData('text/folder-id');
            const draggedDocId = e.dataTransfer.getData('text/plain');

            if (draggedFolderId && draggedFolderId !== folder.id) {
              handleFolderDrop(draggedFolderId, folder.id, mode);
            } else if (draggedDocId) {
              moveDocToFolder(draggedDocId, folder.id);
            }
          });

          const header = document.createElement('div');
          header.className = 'px-2.5 py-2 bg-slate-800 flex items-center justify-between cursor-pointer text-xs font-semibold text-slate-200 gap-1';

          const fUpDisabled = folderIdx === 0 ? 'opacity-30 pointer-events-none' : 'hover:bg-slate-600';
          const fDownDisabled = folderIdx === foldersAtLevel.length - 1 ? 'opacity-30 pointer-events-none' : 'hover:bg-slate-600';

          const sortFolderBtnsHtml = `
            <button class="folder-up-btn px-1.5 py-0.5 bg-slate-700 text-slate-200 rounded text-[10px] shrink-0 ${fUpDisabled}" title="フォルダを上へ">↑</button>
            <button class="folder-down-btn px-1.5 py-0.5 bg-slate-700 text-slate-200 rounded text-[10px] shrink-0 ${fDownDisabled}" title="フォルダを下へ">↓</button>
          `;
          const addSubFolderBtnHtml = `<button class="add-subfolder-btn px-1.5 py-0.5 bg-blue-600/20 hover:bg-blue-600 text-blue-300 hover:text-white rounded text-[10px] shrink-0" title="サブフォルダ作成">＋📁</button>`;
          let deleteFolderBtnHtml = folder.id !== 'folder-default' ? `<button class="delete-folder-btn px-1.5 py-0.5 bg-red-600/20 hover:bg-red-600 text-red-300 hover:text-white rounded text-[10px] shrink-0" title="削除">🗑️</button>` : '';

          header.innerHTML = `
            <div class="flex items-center gap-1.5 truncate flex-1">
              <span class="cursor-grab text-slate-400" title="ドラッグで並び替え">☰</span>
              <span>${folder.collapsed ? '📁' : '📂'}</span>
              <span class="truncate">${folder.name}</span>
              <span class="text-[10px] bg-slate-700 px-1.5 py-0.5 rounded-full text-slate-300">${docsInFolder.length}</span>
            </div>
            <div class="flex items-center gap-1 shrink-0">
              ${sortFolderBtnsHtml}
              ${addSubFolderBtnHtml}
              ${deleteFolderBtnHtml}
            </div>
          `;

          header.addEventListener('click', (e) => {
            if (
              e.target.closest('.delete-folder-btn') ||
              e.target.closest('.add-subfolder-btn') ||
              e.target.closest('.folder-up-btn') ||
              e.target.closest('.folder-down-btn')
            ) return;
            folder.collapsed = !folder.collapsed;
            renderSidebar();
          });

          header.querySelector('.folder-up-btn').addEventListener('click', (e) => {
            e.stopPropagation();
            shiftFolderOrder(folder.id, -1);
          });

          header.querySelector('.folder-down-btn').addEventListener('click', (e) => {
            e.stopPropagation();
            shiftFolderOrder(folder.id, 1);
          });

          const addSubBtn = header.querySelector('.add-subfolder-btn');
          if (addSubBtn) {
            addSubBtn.addEventListener('click', (e) => {
              e.stopPropagation();
              createFolder(folder.id);
            });
          }

          const delFolderBtn = header.querySelector('.delete-folder-btn');
          if (delFolderBtn) {
            delFolderBtn.addEventListener('click', async (e) => {
              e.stopPropagation();
              const targetFolderIds = getDescendantFolderIds(folder.id);
              const targetDocs = state.documents.filter(d => targetFolderIds.includes(d.folderId));

              const msg = `⚠️ 【フォルダ一括削除の確認】\n\n「${folder.name}」フォルダを削除しますか？\n（中身のファイル ${targetDocs.length}個も削除されます）`;
              if (!confirm(msg)) return;

              if (isCloudMode) {
                const batch = db.batch();
                targetDocs.forEach(d => {
                  batch.delete(db.collection('rooms').doc(ROOM_ID).collection('documents').doc(d.id));
                });
                targetFolderIds.forEach(fId => {
                  if (fId !== 'folder-default') {
                    batch.delete(db.collection('rooms').doc(ROOM_ID).collection('folders').doc(fId));
                  }
                });
                await batch.commit();
              } else {
                state.documents = state.documents.filter(d => !targetFolderIds.includes(d.folderId));
                state.folders = state.folders.filter(f => !targetFolderIds.includes(f.id));
                saveState();
                renderSidebar();
              }
            });
          }

          folderEl.appendChild(header);

          if (!folder.collapsed) {
            const bodyEl = document.createElement('div');
            bodyEl.className = 'p-2 space-y-2';

            const subFolderContainer = document.createElement('div');
            subFolderContainer.className = 'pl-2 border-l-2 border-slate-700/70 space-y-1.5';
            if (childFolders.length > 0) {
              bodyEl.appendChild(subFolderContainer);
            }

            if (docsInFolder.length === 0 && childFolders.length === 0) {
              bodyEl.innerHTML = `<div class="text-[11px] text-slate-500 text-center py-2">ファイルをドラッグ、または「＋📁」でサブフォルダ作成</div>`;
            }

            docsInFolder.forEach((doc, idx) => {
              const itemEl = createDocItemElement(doc, idx, docsInFolder.length, flatOptions, false);
              bodyEl.appendChild(itemEl);
            });

            folderEl.appendChild(bodyEl);

            if (childFolders.length > 0) {
              renderSubFoldersInto(subFolderContainer, folder.id, depth + 1, flatOptions);
            }
          }

          container.appendChild(folderEl);
        });
      }

      function renderSubFoldersInto(targetEl, parentId, depth, flatOptions) {
        const foldersAtLevel = state.folders.filter(f => (f.parentId || null) === parentId);
        foldersAtLevel.forEach((folder, folderIdx) => {
          const docsInFolder = state.documents
            .filter(d => d.folderId === folder.id)
            .sort((a, b) => (a.order || 0) - (b.order || 0));
          const childFolders = state.folders.filter(f => f.parentId === folder.id);

          const folderEl = document.createElement('div');
          folderEl.className = 'bg-slate-900/90 border border-slate-700/80 rounded-lg overflow-hidden transition-all';
          folderEl.draggable = true;

          folderEl.addEventListener('dragstart', e => {
            e.stopPropagation();
            e.dataTransfer.setData('text/folder-id', folder.id);
          });

          folderEl.addEventListener('dragover', e => {
            e.preventDefault();
            e.stopPropagation();
            const mode = getFolderDropMode(folderEl, e.clientY);
            applyFolderDropIndicator(folderEl, mode);
          });

          folderEl.addEventListener('dragleave', e => {
            e.stopPropagation();
            clearFolderDropIndicator(folderEl);
          });

          folderEl.addEventListener('drop', e => {
            e.preventDefault();
            e.stopPropagation();
            const mode = getFolderDropMode(folderEl, e.clientY);
            clearFolderDropIndicator(folderEl);

            const draggedFolderId = e.dataTransfer.getData('text/folder-id');
            const draggedDocId = e.dataTransfer.getData('text/plain');

            if (draggedFolderId && draggedFolderId !== folder.id) {
              handleFolderDrop(draggedFolderId, folder.id, mode);
            } else if (draggedDocId) {
              moveDocToFolder(draggedDocId, folder.id);
            }
          });

          const header = document.createElement('div');
          header.className = 'px-2.5 py-2 bg-slate-800/90 flex items-center justify-between cursor-pointer text-xs font-semibold text-slate-200 gap-1';

          const fUpDisabled = folderIdx === 0 ? 'opacity-30 pointer-events-none' : 'hover:bg-slate-600';
          const fDownDisabled = folderIdx === foldersAtLevel.length - 1 ? 'opacity-30 pointer-events-none' : 'hover:bg-slate-600';

          header.innerHTML = `
            <div class="flex items-center gap-1.5 truncate flex-1">
              <span class="cursor-grab text-slate-400" title="ドラッグで並び替え">☰</span>
              <span>${folder.collapsed ? '📁' : '📂'}</span>
              <span class="truncate">${folder.name}</span>
              <span class="text-[10px] bg-slate-700 px-1.5 py-0.5 rounded-full text-slate-300">${docsInFolder.length}</span>
            </div>
            <div class="flex items-center gap-1 shrink-0">
              <button class="folder-up-btn px-1.5 py-0.5 bg-slate-700 text-slate-200 rounded text-[10px] shrink-0 ${fUpDisabled}" title="上へ">↑</button>
              <button class="folder-down-btn px-1.5 py-0.5 bg-slate-700 text-slate-200 rounded text-[10px] shrink-0 ${fDownDisabled}" title="下へ">↓</button>
              <button class="add-subfolder-btn px-1.5 py-0.5 bg-blue-600/20 hover:bg-blue-600 text-blue-300 hover:text-white rounded text-[10px] shrink-0" title="サブフォルダ作成">＋📁</button>
              <button class="delete-folder-btn px-1.5 py-0.5 bg-red-600/20 hover:bg-red-600 text-red-300 hover:text-white rounded text-[10px] shrink-0" title="削除">🗑️</button>
            </div>
          `;

          header.addEventListener('click', (e) => {
            if (
              e.target.closest('.delete-folder-btn') ||
              e.target.closest('.add-subfolder-btn') ||
              e.target.closest('.folder-up-btn') ||
              e.target.closest('.folder-down-btn')
            ) return;
            folder.collapsed = !folder.collapsed;
            renderSidebar();
          });

          header.querySelector('.folder-up-btn').addEventListener('click', (e) => {
            e.stopPropagation();
            shiftFolderOrder(folder.id, -1);
          });

          header.querySelector('.folder-down-btn').addEventListener('click', (e) => {
            e.stopPropagation();
            shiftFolderOrder(folder.id, 1);
          });

          header.querySelector('.add-subfolder-btn').addEventListener('click', (e) => {
            e.stopPropagation();
            createFolder(folder.id);
          });

          header.querySelector('.delete-folder-btn').addEventListener('click', async (e) => {
            e.stopPropagation();
            const targetFolderIds = getDescendantFolderIds(folder.id);
            const targetDocs = state.documents.filter(d => targetFolderIds.includes(d.folderId));

            const msg = `⚠️ 【フォルダ一括削除の確認】\n\n「${folder.name}」フォルダを削除しますか？`;
            if (!confirm(msg)) return;

            if (isCloudMode) {
              const batch = db.batch();
              targetDocs.forEach(d => {
                batch.delete(db.collection('rooms').doc(ROOM_ID).collection('documents').doc(d.id));
              });
              targetFolderIds.forEach(fId => {
                if (fId !== 'folder-default') {
                  batch.delete(db.collection('rooms').doc(ROOM_ID).collection('folders').doc(fId));
                }
              });
              await batch.commit();
            } else {
              state.documents = state.documents.filter(d => !targetFolderIds.includes(d.folderId));
              state.folders = state.folders.filter(f => !targetFolderIds.includes(f.id));
              saveState();
              renderSidebar();
            }
          });

          folderEl.appendChild(header);

          if (!folder.collapsed) {
            const bodyEl = document.createElement('div');
            bodyEl.className = 'p-2 space-y-2';

            if (childFolders.length > 0) {
              const nestedContainer = document.createElement('div');
              nestedContainer.className = 'pl-2 border-l-2 border-slate-700/70 space-y-1.5';
              renderSubFoldersInto(nestedContainer, folder.id, depth + 1, flatOptions);
              bodyEl.appendChild(nestedContainer);
            }

            if (docsInFolder.length === 0 && childFolders.length === 0) {
              bodyEl.innerHTML = `<div class="text-[11px] text-slate-500 text-center py-1.5">空のフォルダ</div>`;
            }

            docsInFolder.forEach((doc, idx) => {
              const itemEl = createDocItemElement(doc, idx, docsInFolder.length, flatOptions, true);
              bodyEl.appendChild(itemEl);
            });

            folderEl.appendChild(bodyEl);
          }

          targetEl.appendChild(folderEl);
        });
      }

      renderFolderTree(null, 0);
    }

    // =========================================================================
    // ビューア画面
    // =========================================================================
    function closeViewer() {
      if (currentStrokeUnsubscribe) {
        currentStrokeUnsubscribe();
        currentStrokeUnsubscribe = null;
      }
      if (resizeHandler) {
        window.removeEventListener('resize', resizeHandler);
        window.removeEventListener('orientationchange', resizeHandler);
        resizeHandler = null;
      }
      if (isCloudMode) updatePresence(null, null);

      const viewerContainer = document.getElementById('viewerContainer');
      viewerContainer.classList.add('hidden');
      viewerContainer.innerHTML = '';

      document.getElementById('appContainer').classList.remove('hidden');
      renderSidebar();
    }

            </div>
          </header>

          <!-- キャンバス領域 -->
          <div id="canvasContainer" class="canvas-container flex-1 overflow-auto relative bg-slate-950/90">
            <div class="canvas-scroll-inner">

          <!-- ツールバー -->

            <button data-tool="pan" class="tool-btn active w-8 h-8 rounded-lg text-base flex items-center justify-center bg-blue-600 text-white shadow" title="移動">✋</button>
            <button data-tool="pen" class="tool-btn w-8 h-8 rounded-lg text-base flex items-center justify-center text-slate-300 hover:bg-slate-800" title="ペン（丸を自動補正）">✏️</button>
            <button data-tool="marker" class="tool-btn w-8 h-8 rounded-lg text-base flex items-center justify-center text-slate-300 hover:bg-slate-800" title="マーカー">🖍️</button>
            <button data-tool="rect" class="tool-btn w-8 h-8 rounded-lg text-base flex items-center justify-center text-slate-300 hover:bg-slate-800" title="四角枠">⬜</button>

            <button id="clearAllBtn" class="w-8 h-8 rounded-lg text-base flex items-center justify-center bg-red-600/20 text-red-300 hover:bg-red-600 hover:text-white transition" title="一括クリア">🗑️</button>
            <div id="tbDivider2" class="bg-slate-700"></div>
            <input type="color" id="colorPicker" value="#ef4444" class="w-7 h-7 rounded-md cursor-pointer bg-transparent border-0 p-0" title="色選択" />
            <select id="lineWidthSelect" class="bg-slate-950 text-[10px] text-slate-200 rounded-md px-1 py-1 border border-slate-700 text-center w-8">
              <option value="1" selected>1</option>
              <option value="2">2</option>
              <option value="4">4</option>
              <option value="8">8</option>
            </select>
          </div>
        </div>
      `;

      function updateToolbarPosition() {
        const toolbar = document.getElementById('floatingToolbar');
        const div1 = document.getElementById('tbDivider1');
        const div2 = document.getElementById('tbDivider2');
        if (!toolbar) return;

        const isLandscape = window.innerWidth > window.innerHeight;

        if (isLandscape) {
          toolbar.className = "absolute right-4 bottom-4 z-30 bg-slate-900/95 backdrop-blur-md px-3 py-2 rounded-2xl border border-slate-700 shadow-2xl flex items-center gap-1.5";
          if (div1) { div1.className = "w-px h-6 bg-slate-700 mx-0.5"; }
          if (div2) { div2.className = "w-px h-6 bg-slate-700 mx-0.5"; }
        } else {
          toolbar.className = "absolute right-3 top-16 z-30 bg-slate-900/95 backdrop-blur-md p-2 rounded-2xl border border-slate-700 shadow-2xl flex flex-col gap-1.5 items-center";
          if (div1) { div1.className = "w-6 h-px bg-slate-700 my-0.5"; }
          if (div2) { div2.className = "w-6 h-px bg-slate-700 my-0.5"; }
        }
      }

      resizeHandler = updateToolbarPosition;
      window.addEventListener('resize', resizeHandler);
      window.addEventListener('orientationchange', resizeHandler);
      updateToolbarPosition();

      document.getElementById('backToListBtn').addEventListener('click', closeViewer);

      initViewerLogic(doc);
    }

    async function initViewerLogic(doc) {
      let currentPage = 1;
      let currentScale = 0.6;
      let activeTool = 'pan';
      let currentColor = '#ef4444';
      let currentWidth = 1;
      let pdfDocInstance = null;
      let redoStack = [];
      const loadedImagesCache = {};

      const pdfCanvas = document.getElementById('pdfCanvas');
      const drawCanvas = document.getElementById('drawCanvas');
      const pdfCtx = pdfCanvas.getContext('2d');
      const wrapper = document.getElementById('canvasWrapper');
      const scaleBox = document.getElementById('canvasScaleBox');
      const canvasContainer = document.getElementById('canvasContainer');

      function applyScale(newScale, keepCenter = true) {
        const prevScrollW = canvasContainer.scrollWidth || 1;
        const prevScrollH = canvasContainer.scrollHeight || 1;
        const centerRatioX = (canvasContainer.scrollLeft + canvasContainer.clientWidth / 2) / prevScrollW;
        const centerRatioY = (canvasContainer.scrollTop + canvasContainer.clientHeight / 2) / prevScrollH;

        currentScale = Math.max(0.1, Math.min(5.0, +newScale.toFixed(3)));
        wrapper.style.transform = `scale(${currentScale})`;
        
        if (scaleBox && pdfCanvas.width > 0 && pdfCanvas.height > 0) {
          scaleBox.style.width = `${Math.round(pdfCanvas.width * currentScale)}px`;
          scaleBox.style.height = `${Math.round(pdfCanvas.height * currentScale)}px`;
        }
        document.getElementById('scaleLabel').textContent = `${Math.round(currentScale * 100)}%`;

        if (keepCenter) {
          const newScrollW = canvasContainer.scrollWidth;
          const newScrollH = canvasContainer.scrollHeight;
          canvasContainer.scrollLeft = Math.max(0, newScrollW * centerRatioX - canvasContainer.clientWidth / 2);
          canvasContainer.scrollTop = Math.max(0, newScrollH * centerRatioY - canvasContainer.clientHeight / 2);
        }
      }

      function centerCanvasScroll() {
        setTimeout(() => {
          if (canvasContainer) {
            const targetX = (canvasContainer.scrollWidth - canvasContainer.clientWidth) / 2;
            const targetY = (canvasContainer.scrollHeight - canvasContainer.clientHeight) / 2;
            canvasContainer.scrollLeft = Math.max(0, targetX);
            canvasContainer.scrollTop = Math.max(0, targetY);
          }
        }, 50);
      }

      let initialPinchDistance = null;
      let initialPinchScale = currentScale;

      function getTouchDistance(touches) {
        const dx = touches[0].clientX - touches[1].clientX;
        const dy = touches[0].clientY - touches[1].clientY;
        return Math.hypot(dx, dy);
      }

      canvasContainer.addEventListener('touchstart', (e) => {
        if (e.touches.length === 2) {
          initialPinchDistance = getTouchDistance(e.touches);
          initialPinchScale = currentScale;
        }
      }, { passive: true });

      canvasContainer.addEventListener('touchmove', (e) => {
        if (e.touches.length === 2 && initialPinchDistance !== null) {
          e.preventDefault();
          const currentDistance = getTouchDistance(e.touches);
          const ratio = currentDistance / initialPinchDistance;
          applyScale(initialPinchScale * ratio, true);
        }
      }, { passive: false });

      canvasContainer.addEventListener('touchend', (e) => {
        if (e.touches.length < 2) {
          initialPinchDistance = null;
        }
      }, { passive: true });

      function subscribePageStrokes(pageKey) {
        if (currentStrokeUnsubscribe) {
          currentStrokeUnsubscribe();
          currentStrokeUnsubscribe = null;
        }
        if (!isCloudMode) {
          drawOverlay();
          return;
        }

        if (!annotations[pageKey]) annotations[pageKey] = [];

        const strokesRef = db.collection('rooms').doc(ROOM_ID)
          .collection('annotations').doc(pageKey)
          .collection('strokes').orderBy('createdAt', 'asc');

        currentStrokeUnsubscribe = strokesRef.onSnapshot(snap => {
          snap.docChanges().forEach(change => {
            const strokeId = change.doc.id;
            const data = change.doc.data();

            if (change.type === 'added') {
              if (!annotations[pageKey].find(s => s.id === strokeId)) {
                annotations[pageKey].push({ id: strokeId, ...data });
              }
            } else if (change.type === 'modified') {
              const idx = annotations[pageKey].findIndex(s => s.id === strokeId);
              if (idx !== -1) annotations[pageKey][idx] = { id: strokeId, ...data };
            } else if (change.type === 'removed') {
              annotations[pageKey] = annotations[pageKey].filter(s => s.id !== strokeId);
            }
          });
          drawOverlay();
        });
      }

      function autoFitScale(imgWidth, imgHeight) {
        const maxW = Math.max(200, canvasContainer.clientWidth - 96);
        const maxH = Math.max(200, canvasContainer.clientHeight - 96);
        const scaleX = maxW / imgWidth;
        const scaleY = maxH / imgHeight;
        return Math.max(0.1, Math.min(scaleX, scaleY, 1.0));
      }

      async function renderPage() {
        const pageKey = `${doc.id}_p${currentPage}`;
        if (isCloudMode) {
          updatePresence(doc.id, currentPage);
        }

        if (doc.type === 'sample') {
          pdfCanvas.width = 800;
          pdfCanvas.height = 1100;
          drawCanvas.width = 800;
          drawCanvas.height = 1100;
          pdfCtx.fillStyle = '#ffffff';
          pdfCtx.fillRect(0, 0, 800, 1100);
          pdfCtx.strokeStyle = '#334155';
          pdfCtx.lineWidth = 3;
          pdfCtx.strokeRect(50, 50, 700, 1000);
          pdfCtx.fillStyle = '#0f172a';
          pdfCtx.font = 'bold 24px sans-serif';
          pdfCtx.fillText(`サンプル建築平面図 - ${currentPage}階`, 80, 100);
          pdfCtx.strokeRect(100, 160, 280, 240);
          pdfCtx.strokeRect(380, 160, 320, 240);
          pdfCtx.fillText('会議室 A', 180, 285);
          pdfCtx.fillText('執務スペース', 480, 285);
          document.getElementById('pageIndicator').textContent = `${currentPage}/2`;
          applyScale(autoFitScale(800, 1100), false);
          centerCanvasScroll();
          subscribePageStrokes(pageKey);
          return;
        }

        if (doc.type === 'image' || doc.type === 'cad') {
          const img = new Image();
          img.onload = () => {
            pdfCanvas.width = img.width;
            pdfCanvas.height = img.height;
            drawCanvas.width = img.width;
            drawCanvas.height = img.height;
            pdfCtx.drawImage(img, 0, 0);

            if (doc.type === 'cad') {
              pdfCtx.fillStyle = 'rgba(15, 23, 42, 0.7)';
              pdfCtx.fillRect(20, 20, 240, 40);
              pdfCtx.fillStyle = '#38bdf8';
              pdfCtx.font = 'bold 16px sans-serif';
              pdfCtx.fillText('📐 CAD図面レイヤー', 35, 45);
            }

            applyScale(autoFitScale(img.width, img.height), false);
            centerCanvasScroll();
            document.getElementById('pageIndicator').textContent = `1/1`;
            subscribePageStrokes(pageKey);
          };
          img.src = doc.dataUrl;
          return;
        }

        if (doc.type === 'pdf') {
          try {
            if (!pdfDocInstance) {
              let loadingTask;
              if (doc.dataUrl && doc.dataUrl.startsWith('data:')) {
                const base64Data = doc.dataUrl.split(',')[1];
                const binaryString = atob(base64Data);
                const len = binaryString.length;
                const bytes = new Uint8Array(len);
                for (let i = 0; i < len; i++) {
                  bytes[i] = binaryString.charCodeAt(i);
                }
                loadingTask = pdfjsLib.getDocument({ data: bytes });
              } else {
                loadingTask = pdfjsLib.getDocument(doc.dataUrl);
              }
              pdfDocInstance = await loadingTask.promise;
              doc.numPages = pdfDocInstance.numPages;
            }

            const page = await pdfDocInstance.getPage(currentPage);
            const viewport = page.getViewport({ scale: 1.5 });
            pdfCanvas.width = viewport.width;
            pdfCanvas.height = viewport.height;
            drawCanvas.width = viewport.width;
            drawCanvas.height = viewport.height;

            await page.render({ canvasContext: pdfCtx, viewport }).promise;
            document.getElementById('pageIndicator').textContent = `${currentPage}/${doc.numPages}`;

            applyScale(autoFitScale(viewport.width, viewport.height), false);
            centerCanvasScroll();
            subscribePageStrokes(pageKey);
          } catch (err) {
            console.error(err);
            pdfCanvas.width = 600;
            pdfCanvas.height = 800;
            drawCanvas.width = 600;
            drawCanvas.height = 800;
            pdfCtx.fillStyle = '#1e293b';
            pdfCtx.fillRect(0, 0, 600, 800);
            pdfCtx.fillStyle = '#ef4444';
            pdfCtx.font = '16px sans-serif';
            pdfCtx.textAlign = 'center';
            pdfCtx.fillText('PDFの読み込みに失敗しました', 300, 400);
            applyScale(autoFitScale(600, 800), false);
            centerCanvasScroll();
          }
        }
      }

      function trySnapToCircle(stroke) {
        if (stroke.tool !== 'pen' || !stroke.points || stroke.points.length < 10) return stroke;
        const pts = stroke.points;
        const start = pts[0];
        const end = pts[pts.length - 1];

        let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
        pts.forEach(p => {
          if (p.x < minX) minX = p.x;
          if (p.x > maxX) maxX = p.x;
          if (p.y < minY) minY = p.y;
          if (p.y > maxY) maxY = p.y;
        });

        const width = maxX - minX;
        const height = maxY - minY;
        const size = Math.max(width, height);
        if (size < 20) return stroke;

        const aspectRatio = Math.min(width, height) / size;
        if (aspectRatio < 0.65) return stroke;

        const closeDist = Math.hypot(end.x - start.x, end.y - start.y);
        if (closeDist > size * 0.4) return stroke;

        const cx = (minX + maxX) / 2;
        const cy = (minY + maxY) / 2;
        let sumR = 0;
        pts.forEach(p => { sumR += Math.hypot(p.x - cx, p.y - cy); });
        const avgR = sumR / pts.length;

        let maxDev = 0;
        pts.forEach(p => {
          const dev = Math.abs(Math.hypot(p.x - cx, p.y - cy) - avgR);
          if (dev > maxDev) maxDev = dev;
        });

        if (maxDev < avgR * 0.32) {
          return {
            tool: 'circle',
            color: stroke.color,
            width: stroke.width,
            cx: Math.round(cx),
            cy: Math.round(cy),
            r: Math.round(avgR)
          };
        }
        return stroke;
      }

      function drawOverlay() {
        const ctx = drawCanvas.getContext('2d');
        ctx.clearRect(0, 0, drawCanvas.width, drawCanvas.height);
        const key = `${doc.id}_p${currentPage}`;
        const strokes = annotations[key] || [];

        strokes.forEach(s => {
          ctx.save();
          if (s.tool === 'image' && s.dataUrl) {
            if (loadedImagesCache[s.id]) {
              ctx.drawImage(loadedImagesCache[s.id], s.x, s.y, s.width, s.height);
            } else {
              const img = new Image();
              img.onload = () => {
                loadedImagesCache[s.id] = img;
                drawOverlay();
              };
              img.src = s.dataUrl;
            }
          } else {
            ctx.strokeStyle = s.color;
            ctx.fillStyle = s.color;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';

            if (s.tool === 'pen' || s.tool === 'marker') {
              ctx.globalAlpha = s.tool === 'marker' ? 0.35 : 1.0;
              ctx.lineWidth = s.tool === 'marker' ? s.width * 4 : s.width;
              ctx.beginPath();
              if (s.points) {
                s.points.forEach((pt, idx) => idx === 0 ? ctx.moveTo(pt.x, pt.y) : ctx.lineTo(pt.x, pt.y));
              }
              ctx.stroke();
            } else if (s.tool === 'circle') {
              ctx.lineWidth = s.width;
              ctx.beginPath();
              ctx.arc(s.cx, s.cy, s.r, 0, Math.PI * 2);
              ctx.stroke();
            } else if (s.tool === 'rect') {
              ctx.lineWidth = s.width;
              ctx.strokeRect(s.startX, s.startY, s.endX - s.startX, s.endY - s.startY);
            } else if (s.tool === 'text') {
              ctx.font = `bold ${Math.max(16, s.width * 4)}px sans-serif`;
              ctx.fillText(s.text, s.x, s.y);
            }
          }
          ctx.restore();
        });
      }

      async function saveAndRedraw(stroke) {
        const key = `${doc.id}_p${currentPage}`;
        if (!annotations[key]) annotations[key] = [];
        redoStack = [];

        const strokeId = 'st-' + Date.now() + '-' + Math.random().toString(36).substring(2, 6);
        stroke.id = strokeId;

        annotations[key].push(stroke);
        drawOverlay();

        if (isCloudMode) {
          const payload = { ...stroke, createdAt: Date.now() };
          await db.collection('rooms').doc(ROOM_ID)
            .collection('annotations').doc(key)
            .collection('strokes').doc(strokeId).set(payload);
        } else {
          saveAnnotationsData();
        }
      }

      document.getElementById('exportImageBtn').addEventListener('click', () => {
        try {
          const exportCanvas = document.createElement('canvas');
          exportCanvas.width = pdfCanvas.width;
          exportCanvas.height = pdfCanvas.height;
          const exportCtx = exportCanvas.getContext('2d');

          exportCtx.drawImage(pdfCanvas, 0, 0);
          exportCtx.drawImage(drawCanvas, 0, 0);

          const baseName = doc.name.replace(/\.[^/.]+$/, "");
          const fileName = `${baseName}_p${currentPage}.png`;

          exportCanvas.toBlob((blob) => {
            if (!blob) return;
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = fileName;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
          }, 'image/png');
        } catch (err) {
          console.error(err);
          alert('画像の書き出しに失敗しました。');
        }
      });

      document.getElementById('clearAllBtn').addEventListener('click', async () => {
        const key = `${doc.id}_p${currentPage}`;
        const strokes = annotations[key] || [];
        if (strokes.length === 0) {
          alert('消去する書き込みがありません。');
          return;
        }

        if (!confirm('本当にこのページのすべての書き込みを削除しますか？\n（この操作は元に戻せません）')) {
          return;
        }

        annotations[key] = [];
        drawOverlay();

        if (isCloudMode) {
          const batch = db.batch();
          const strokesRef = db.collection('rooms').doc(ROOM_ID)
            .collection('annotations').doc(key)
            .collection('strokes');

          const snap = await strokesRef.get();
          snap.forEach(d => {
            batch.delete(d.ref);
          });
          await batch.commit();
        } else {
          saveAnnotationsData();
        }
      });

      document.getElementById('prevPageBtn').addEventListener('click', () => {
        if (currentPage > 1) { currentPage--; renderPage(); }
      });
      document.getElementById('nextPageBtn').addEventListener('click', () => {
        const max = doc.type === 'sample' ? 2 : (doc.numPages || 1);
        if (currentPage < max) { currentPage++; renderPage(); }
      });

      document.getElementById('zoomInBtn').addEventListener('click', () => {
        applyScale(currentScale + 0.15, true);
      });
      document.getElementById('zoomOutBtn').addEventListener('click', () => {
        applyScale(currentScale - 0.15, true);
      });

      document.getElementById('undoBtn').addEventListener('click', async () => {
        const key = `${doc.id}_p${currentPage}`;
        const strokes = annotations[key];
        if (!strokes || strokes.length === 0) return;

        const popped = strokes.pop();
        redoStack.push(popped);
        drawOverlay();

        if (isCloudMode) {
          await db.collection('rooms').doc(ROOM_ID)
            .collection('annotations').doc(key)
            .collection('strokes').doc(popped.id).delete();
        } else {
          saveAnnotationsData();
        }
      });

      document.getElementById('redoBtn').addEventListener('click', async () => {
        const key = `${doc.id}_p${currentPage}`;
        if (redoStack.length === 0) return;
        if (!annotations[key]) annotations[key] = [];

        const restored = redoStack.pop();
        annotations[key].push(restored);
        drawOverlay();

        if (isCloudMode) {
          const payload = { ...restored, createdAt: Date.now() };
          await db.collection('rooms').doc(ROOM_ID)
            .collection('annotations').doc(key)
            .collection('strokes').doc(restored.id).set(payload);
        } else {
          saveAnnotationsData();
        }
      });

      document.getElementById('addPhotoBtn').addEventListener('click', () => document.getElementById('photoFileInput').click());
      document.getElementById('photoFileInput').addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (event) => {
          const dataUrl = event.target.result;
          const img = new Image();
          img.onload = () => {
            const maxW = 200;
            saveAndRedraw({
              tool: 'image',
              dataUrl: dataUrl,
              x: 100,
              y: 100,
              width: maxW,
              height: img.height * (maxW / img.width)
            });
          };
          img.src = dataUrl;
        };
        reader.readAsDataURL(file);
        e.target.value = '';
      });

      document.querySelectorAll('.tool-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          activeTool = btn.dataset.tool;
          document.querySelectorAll('.tool-btn').forEach(b => {
            b.className = b === btn
              ? 'tool-btn active w-8 h-8 rounded-lg text-base flex items-center justify-center bg-blue-600 text-white shadow'
              : 'tool-btn w-8 h-8 rounded-lg text-base flex items-center justify-center text-slate-300 hover:bg-slate-800';
          });
          updateTouchAction();
        });
      });

      function updateTouchAction() {
        if (activeTool === 'pan') {
          drawCanvas.style.touchAction = 'pan-x pan-y';
          drawCanvas.style.pointerEvents = 'none';
          drawCanvas.style.cursor = 'grab';
        } else {
          drawCanvas.style.touchAction = 'none';
          drawCanvas.style.pointerEvents = 'auto';
          drawCanvas.style.cursor = 'crosshair';
        }
      }
      updateTouchAction();

      document.getElementById('colorPicker').addEventListener('input', e => currentColor = e.target.value);
      document.getElementById('lineWidthSelect').addEventListener('change', e => currentWidth = parseInt(e.target.value));

      let isDrawing = false;
      let currentStroke = null;

      drawCanvas.addEventListener('pointerdown', async (e) => {
        if (activeTool === 'pan') return;
        e.preventDefault();
        drawCanvas.setPointerCapture(e.pointerId);
        const rect = drawCanvas.getBoundingClientRect();
        const pos = {
          x: Math.round((e.clientX - rect.left) / currentScale),
          y: Math.round((e.clientY - rect.top) / currentScale)
        };

        if (activeTool === 'text') {
          const text = prompt('テキストを入力:');
          if (text && text.trim()) {
            saveAndRedraw({ tool: 'text', color: currentColor, width: currentWidth, x: pos.x, y: pos.y, text: text.trim() });
          }
          return;
        }

        if (activeTool === 'eraser') {
          const key = `${doc.id}_p${currentPage}`;
          const strokes = annotations[key] || [];
          let targetId = null;
          strokes.forEach(s => {
            if (s.points && s.points.some(pt => Math.hypot(pt.x - pos.x, pt.y - pos.y) < 25)) targetId = s.id;
            else if (s.tool === 'circle' && Math.abs(Math.hypot(pos.x - s.cx, pos.y - s.cy) - s.r) < 25) targetId = s.id;
            else if (s.tool === 'image' && pos.x >= s.x && pos.x <= s.x + s.width && pos.y >= s.y && pos.y <= s.y + s.height) targetId = s.id;
          });
          if (targetId) {
            annotations[key] = annotations[key].filter(s => s.id !== targetId);
            drawOverlay();
            if (isCloudMode) {
              await db.collection('rooms').doc(ROOM_ID)
                .collection('annotations').doc(key)
                .collection('strokes').doc(targetId).delete();
            } else {
              saveAnnotationsData();
            }
          }
          return;
        }

        isDrawing = true;
        currentStroke = {
          tool: activeTool,
          color: currentColor,
          width: currentWidth,
          points: [pos],
          startX: pos.x,
          startY: pos.y,
          endX: pos.x,
          endY: pos.y
        };
      });

      drawCanvas.addEventListener('pointermove', (e) => {
        if (activeTool === 'pan' || !isDrawing || !currentStroke) return;
        const rect = drawCanvas.getBoundingClientRect();
        const pos = {
          x: Math.round((e.clientX - rect.left) / currentScale),
          y: Math.round((e.clientY - rect.top) / currentScale)
        };

        if (currentStroke.tool === 'pen' || currentStroke.tool === 'marker') {
          const lastPt = currentStroke.points[currentStroke.points.length - 1];
          if (!lastPt || Math.hypot(pos.x - lastPt.x, pos.y - lastPt.y) >= 2) {
            currentStroke.points.push(pos);
          }
        } else if (currentStroke.tool === 'rect') {
          currentStroke.endX = pos.x;
          currentStroke.endY = pos.y;
        }

        drawOverlay();
        const ctx = drawCanvas.getContext('2d');
        ctx.save();
        ctx.strokeStyle = currentStroke.color;
        ctx.lineCap = 'round';
        if (currentStroke.tool === 'pen' || currentStroke.tool === 'marker') {
          ctx.globalAlpha = currentStroke.tool === 'marker' ? 0.35 : 1.0;
          ctx.lineWidth = currentStroke.tool === 'marker' ? currentStroke.width * 4 : currentStroke.width;
          ctx.beginPath();
          currentStroke.points.forEach((pt, idx) => idx === 0 ? ctx.moveTo(pt.x, pt.y) : ctx.lineTo(pt.x, pt.y));
          ctx.stroke();
        } else if (currentStroke.tool === 'rect') {
          ctx.lineWidth = currentStroke.width;
          ctx.strokeRect(currentStroke.startX, currentStroke.startY, currentStroke.endX - currentStroke.startX, currentStroke.endY - currentStroke.startY);
        }
        ctx.restore();
      });

      drawCanvas.addEventListener('pointerup', async (e) => {
        if (activeTool === 'pan' || !isDrawing || !currentStroke) return;
        isDrawing = false;
        const finalStroke = trySnapToCircle(currentStroke);
        await saveAndRedraw(finalStroke);
        currentStroke = null;
      });

      renderPage();
    }

    renderSidebar();
  </script>
</body>
</html>
